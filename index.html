<!DOCTYPE html>
<!--
  COMO USAR NO GITHUB PAGES
  1) No seu repositório, troque SUA_URL_AQUI abaixo pela URL /exec da sua
     implantação do Apps Script (a mesma usada no app), seguida de "?app=1".
  2) Salve este arquivo como "index.html" na raiz do repositório (ou dentro
     de /docs, se preferir servir dessa pasta).
  3) No GitHub: Settings → Pages → Source → escolha a branch (e a pasta,
     se usar /docs) → Save.
  4) Aguarde alguns minutos: o GitHub publica em
     https://SEU_USUARIO.github.io/SEU_REPOSITORIO/

  OBS: isto NÃO funciona colado direto num README.md — o GitHub remove
  tags <iframe>/<script> ao renderizar a página do repositório. Só funciona
  como página estática publicada pelo GitHub Pages.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão de Documentos</title>
<style>
  html,body{height:100%;margin:0;background:#eef1f6;font-family:system-ui,Arial,sans-serif}
  .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
  iframe{
    width:100%;
    max-width:520px;
    height:820px;
    max-height:92vh;
    border:0;
    border-radius:16px;
    box-shadow:0 8px 30px rgba(0,0,0,.15);
    display:block;
    background:#fff;
  }
</style>
</head>
<body>
  <div class="wrap">
    <iframe
      src="https://script.google.com/macros/s/AKfycbxWd5Koielaa9VtbgYzMuBYIVPen8NFBlJMS3_52QY1U0nZXUCo1Qk7O8g7ezJiNRmHbA/exec?app=1"
      title="Gestão de Documentos"
      loading="lazy">
    </iframe>
  </div>
</body>
</html>
