document.addEventListener('click', e => {
  const pop = $('.viewmenu-pop.open');
  if(pop && !e.target.closest('.viewmenu')) pop.classList.remove('open');
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;
  const id = el.dataset.id || null;

  if(a === 'recarregar'){ location.reload(); return; }
  if(a === 'buscar-dados'){ buscarDadosLogin(); return; }
  if(a === 'salvar-url-login'){ salvarUrlLogin(); return; }

  const u = currentUser();
  if(!u) return;

  switch(a){
    case 'logout':
      session = null; store.set('rio_session',''); mostrarLogin(); buscarDadosLogin(); break;
    case 'nav':
      navigate(el.dataset.view);
      break;
    case 'menu-view': {
      const p = $('#viewPop'); if(p) p.classList.toggle('open');
      break;
    }
    case 'set-view':
      state.viewMode = el.dataset.mode;
      renderDashboard();
      break;
    case 'open-folder':
      state.currentFolderId = id; state.search = ''; renderDashboard(); break;
    case 'goto':
      state.currentFolderId = id || null; state.search = ''; renderDashboard(); break;
    case 'voltar': {
      const p = pastaPorId(state.currentFolderId);
      state.currentFolderId = p ? (p.parentId || null) : null;
      state.search = ''; renderDashboard(); break;
    }
    case 'nova-pasta':
      if(!permsAtuais().includes('criar_pasta')){ toast('Sem permissão para criar pastas.','error'); break; }
      modalNovaPasta(); break;
    case 'novo-doc':
      if(!permsAtuais().includes('upload')){ toast('Sem permissão de upload nesta pasta.','error'); break; }
      modalDoc(null); break;
    case 'enviar-arquivo': { const inp = $('#fileInput'); if(inp) inp.click(); break; }
    case 'abrir-camera':
      if(!permsAtuais().includes('upload')){ toast('Sem permissão de upload nesta pasta.','error'); break; }
      modalCamera(); break;
    case 'cam-add': { const inp = $('#camInput'); if(inp) inp.click(); break; }
    case 'cam-gallery': { const inp = $('#camGallery'); if(inp) inp.click(); break; }
    case 'cam-remove':
      camPages.splice(Number(el.dataset.idx), 1);
      renderCamPages();
      break;
    case 'cam-save-pdf': {
      if(!camPages.length){ toast('Capture ao menos uma página.','error'); break; }
      if(!permsAtuais().includes('upload')){ toast('Sem permissão de upload nesta pasta.','error'); break; }
      toast('Gerando PDF…','info');
      const dataUrl = paginasParaPDF(camPages);
      const now = new Date();
      const base = {id: uid('d'), pastaId: state.currentFolderId, titulo: 'Digitalização ' + now.toLocaleDateString('pt-BR') + ' ' + now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}), tipo:'arquivo', ext:'pdf', mime:'application/pdf', criadoPor:u.id, criadoEm:Date.now(), atualizadoEm:Date.now()};
      if(salvarDocArquivo(base, dataUrl)){ fecharModal(); toast('PDF salvo na pasta com sucesso.'); renderItens(); }
      break;
    }
    case 'cam-save-imgs': {
      if(!camPages.length){ toast('Capture ao menos uma página.','error'); break; }
      if(!permsAtuais().includes('upload')){ toast('Sem permissão de upload nesta pasta.','error'); break; }
      let ok = 0;
      camPages.forEach((p, i) => {
        const base = {id: uid('d'), pastaId: state.currentFolderId, titulo: 'Digitalização pág. ' + (i+1) + ' ' + new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}), tipo:'arquivo', ext:'jpg', mime:'image/jpeg', criadoPor:u.id, criadoEm:Date.now(), atualizadoEm:Date.now()};
        if(salvarDocArquivo(base, p)) ok++;
      });
      if(ok){ fecharModal(); toast(ok + ' imagem(ns) salva(s) na pasta.'); renderItens(); }
      break;
    }
    case 'ver-doc': modalVer(id); break;
    case 'mover-doc': {
      const d = DB.get('Documentos').find(x => x.id === id); if(!d) break;
      if(!permsDoc(d).includes('editar')){ toast('Sem permissão para mover este arquivo.','error'); break; }
      modalMover(d);
      break;
    }
    case 'confirmar-mover': {
      const d = DB.get('Documentos').find(x => x.id === id); if(!d) break;
      const dest = ($('#moverDest') || {}).value;
      const destId = dest === '' ? null : dest;
      if(destId === d.pastaId){ toast('O arquivo já está nesta pasta.','info'); break; }
      const alvo = destId ? pastaPorId(destId) : null;
      if(destId && !permsEff(u.id, alvo).includes('upload')){ toast('Sem permissão de upload na pasta de destino.','error'); break; }
      DB.set('Documentos', DB.get('Documentos').map(x => x.id === id ? Object.assign({}, x, {pastaId: destId, movePending: true, atualizadoEm: Date.now()}) : x));
      fecharModal();
      toast('Arquivo movido para "' + (alvo ? alvo.nome : 'Raiz') + '". Sincronizando no Drive…');
      renderItens();
      break;
    }
    case 'editar-doc': {
      const d = DB.get('Documentos').find(x => x.id === id); if(!d) break;
      if(!permsDoc(d).includes('editar')){ toast('Sem permissão para editar este arquivo.','error'); break; }
      const cat = categoria(d);
      if(d.tipo === 'arquivo' && cat === 'word' && window.mammoth && (d.arquivo || d.driveId)) abrirEditorWord(d);
      else if(d.tipo === 'arquivo' && cat === 'sheet' && window.XLSX && (d.arquivo || d.driveId)) abrirEditorSheet(d);
      else modalDoc(id);
      break;
    }
    case 'w-cmd': {
      const ed = $('#wEditor'); if(ed) ed.focus();
      try{ document.execCommand(el.dataset.cmd, false, el.dataset.val || null); }catch(err){}
      break;
    }
    case 's-tab':
      syncActiveFromDOM();
      sheetState.active = Number(el.dataset.idx);
      renderSheetEditor();
      break;
    case 's-addrow':
      syncActiveFromDOM();
      sheetState.sheets[sheetState.active].aoa.push(Array(sheetCols()).fill(''));
      renderSheetEditor();
      break;
    case 's-delrow':
      syncActiveFromDOM(); {
        const s = sheetState.sheets[sheetState.active];
        if(s.aoa.length > 1) s.aoa.pop();
      }
      renderSheetEditor();
      break;
    case 's-addcol':
      syncActiveFromDOM();
      sheetState.sheets[sheetState.active].aoa.forEach(r => r.push(''));
      renderSheetEditor();
      break;
    case 's-delcol':
      syncActiveFromDOM(); {
        const s = sheetState.sheets[sheetState.active];
        const cols = s.aoa.reduce((m, r) => Math.max(m, (r||[]).length), 1);
        if(cols > 1) s.aoa.forEach(r => r.pop());
      }
      renderSheetEditor();
      break;
    case 's-addsheet':
      syncActiveFromDOM();
      sheetState.sheets.push({name: 'Planilha' + (sheetState.sheets.length + 1), aoa: Array.from({length: 12}, () => Array(6).fill(''))});
      sheetState.active = sheetState.sheets.length - 1;
      renderSheetEditor();
      break;
    case 'salvar-word': {
      const d = DB.get('Documentos').find(x => x.id === id); if(!d) break;
      const titulo = ($('#wTitulo') || {}).value.trim() || d.titulo;
      const ed = $('#wEditor'); if(!ed) break;
      if(!window.htmlDocx){ toast('Biblioteca html-docx indisponível.','error'); break; }
      const htmlFull = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + esc(titulo) + '</title></head><body>' + ed.innerHTML + '</body></html>';
      const blob = window.htmlDocx.asBlob(htmlFull);
      blobToDataURL(blob).then(url => {
        if(salvarArquivoBin(d, url, titulo)){ fecharModal(); toast('DOCX salvo com sucesso.'); renderItens(); }
      }).catch(() => toast('Falha ao gerar o DOCX.','error'));
      break;
    }
    case 'salvar-sheet': {
      const d = DB.get('Documentos').find(x => x.id === id); if(!d) break;
      const titulo = ($('#sTitulo') || {}).value.trim() || d.titulo;
      if(!window.XLSX || !sheetState){ toast('Editor não inicializado.','error'); break; }
      syncActiveFromDOM();
      const wb = window.XLSX.utils.book_new();
      sheetState.sheets.forEach((s, i) => {
        window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.aoa_to_sheet(s.aoa), String(s.name || ('Planilha' + (i+1))).slice(0, 31));
      });
      const b64 = window.XLSX.write(wb, {bookType:'xlsx', type:'base64'});
      const url = 'data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,' + b64;
      if(salvarArquivoBin(d, url, titulo)){ fecharModal(); toast('XLSX salvo com sucesso.'); renderItens(); }
      break;
    }
    case 'editar-usuario': modalEditarUsuario(id); break;
    case 'salvar-dados-usuario': {
      const x = getUsuarios().find(y => y.id === id); if(!x) break;
      if(!(ehAdmin(u) || x.id === u.id)){ toast('Sem permissão para editar este usuário.','error'); break; }
      const nome = $('#eNome').value.trim();
      const email = $('#eEmail').value.trim().toLowerCase();
      const senha = $('#eSenha').value;
      if(!nome){ toast('Informe o nome.','error'); break; }
      if(!email.includes('@')){ toast('Informe um e-mail válido.','error'); break; }
      if(getUsuarios().some(y => y.id !== x.id && y.email.toLowerCase() === email)){ toast('Este e-mail já está cadastrado.','error'); break; }
      if(senha && senha.length < 6){ toast('A nova senha deve ter 6+ caracteres.','error'); break; }
      DB.set('Usuarios', DB.get('Usuarios').map(y => y.id === x.id ? Object.assign({}, y, {
        nome: nome, email: email, senha: senha ? senha : y.senha
      }) : y));
      fecharModal();
      toast('Dados do usuário atualizados.');
      if(x.id === u.id) renderApp(); else renderUsuarios();
      break;
    }
    case 'imprimir-doc': {
      const d = DB.get('Documentos').find(x => x.id === id); if(!d) break;
      if(!permsDoc(d).includes('imprimir')){ toast('Sem permissão de impressão para este arquivo.','error'); break; }
      imprimirDoc(d); break;
    }
    case 'baixar-doc': {
      const d = DB.get('Documentos').find(x => x.id === id); if(!d) break;
      if(!permsDoc(d).includes('download')){ toast('Sem permissão de download para este arquivo. Solicite acesso ao administrador.','error'); break; }
      baixarArquivo(d); toast('Download iniciado.','info'); break;
    }
    case 'abrir-drive': {
      const d = DB.get('Documentos').find(x => x.id === id);
      if(d && d.driveUrl && permsDoc(d).includes('download')) window.open(d.driveUrl, '_blank');
      else toast('Sem permissão de download para este arquivo.','error');
      break;
    }
    case 'toggle-perm':
      el.classList.toggle('on');
      atualizarPcount(el.closest('.prow'));
      break;
    case 'bulk-preset':
      $$('#modalCard .prow').forEach(row => aplicarPresetRow(row, el.dataset.preset));
      toast('Perfil aplicado a todos os usuários listados.','info');
      break;
    case 'excluir-doc': {
      const d = DB.get('Documentos').find(x => x.id === id);
      if(!permsDoc(d).includes('excluir')){ toast('Sem permissão de exclusão.','error'); break; }
      modalConfirm('Excluir arquivo', 'Excluir definitivamente <b>' + esc(d ? d.titulo : '') + '</b>? A ação será sincronizada com Sheets/Drive.', () => {
        DB.set('Documentos', DB.get('Documentos').filter(x => x.id !== id));
        delete pendingArquivos[id];
        toast('Arquivo excluído.'); renderItens();
      }); break;
    }
    case 'excluir-pasta': {
      const p = pastaPorId(id);
      const perms = permsAtuais();
      const dono = p && (p.criadaPor === u.id || ehAdmin(u));
      if(!dono && !perms.includes('excluir_pasta')){ toast('Sem permissão para excluir pasta.','error'); break; }
      modalConfirm('Excluir pasta', 'Excluir a pasta <b>' + esc(p ? p.nome : '') + '</b> com todas as subpastas e arquivos? (A pasta do Drive permanece com os arquivos já enviados.)', () => {
        excluirPastaRec(id);
        if(state.currentFolderId === id) state.currentFolderId = null;
        toast('Pasta excluída.'); renderDashboard();
      }); break;
    }
    case 'compartilhar': modalCompartilhar(id); break;
    case 'perms-user':
      if(ehAdmin(u)) modalPermsUser(id);
      else toast('Apenas administradores podem editar permissões.','error');
      break;
    case 'preset-perms': {
      const set = presetSet(el.dataset.preset);
      $$('#modalCard input[data-perm]').forEach(cb => { cb.checked = set.includes(cb.dataset.perm); });
      break;
    }
    case 'salvar-perms-user': {
      if(!ehAdmin(u)){ toast('Apenas administradores podem editar permissões.','error'); break; }
      let perms = lerCheckboxes($('#modalCard'));
      if(perms.length && !perms.includes('visualizar')) perms.unshift('visualizar');
      DB.set('Usuarios', DB.get('Usuarios').map(x => x.id === id ? Object.assign({}, x, {perms:perms}) : x));
      fecharModal(); toast('Permissões globais atualizadas.'); renderUsuarios(); break;
    }
    case 'trocar-logo': { const inp = $('#logoInput'); if(inp) inp.click(); break; }
    case 'reset-logo':
      cfgLogo = PLACEHOLDER_LOGO;
      const pv1 = $('#cfgLogoPrev'); if(pv1) pv1.src = cfgLogo;
      toast('Logotipo padrão restaurado — clique em Salvar alterações.','info');
      break;
    case 'fmt-all':
      $$('#viewRoot input[data-fmt]').forEach(cb => cb.checked = true);
      break;
    case 'fmt-none':
      $$('#viewRoot input[data-fmt]').forEach(cb => cb.checked = false);
      break;
    case 'salvar-config': {
      if(!ehAdmin(u)){ toast('Apenas administradores podem alterar as configurações.','error'); break; }
      const formats = $$('#viewRoot input[data-fmt]:checked').map(i => i.dataset.fmt);
      if(!formats.length){ toast('Selecione ao menos um formato de upload.','error'); break; }
      const obj = Object.assign({}, getEmpresa(), {
        nome: $('#cfgNome').value.trim(),
        fantasia: $('#cfgFantasia').value.trim(),
        cnpj: $('#cfgCnpj').value.trim(),
        responsavel: $('#cfgResp').value.trim(),
        endereco: $('#cfgEnd').value.trim(),
        cidade: $('#cfgCidade').value.trim(),
        cep: $('#cfgCep').value.trim(),
        telefone: $('#cfgTel').value.trim(),
        email: $('#cfgEmail').value.trim(),
        site: $('#cfgSite').value.trim(),
        logo: cfgLogo || '',
        formats: formats
      });
      try{ setEmpresa(obj); }catch(err){ toast('Logotipo muito grande para o armazenamento local.','error'); break; }
      toast('Configurações salvas com sucesso!');
      renderApp();
      break;
    }
    case 'fechar-modal': fecharModal(); break;
    case 'confirmar-pendente': fecharModal(); if(acaoPendente){ const f = acaoPendente; acaoPendente = null; f(); } break;
    case 'verificar-versao':
      verificarVersao();
      break;
    case 'salvar-pasta': {
      if(!permsAtuais().includes('criar_pasta')){ toast('Sem permissão para criar pastas.','error'); break; }
      const nome = ($('#mNomePasta') || {}).value;
      if(!nome || !nome.trim()){ toast('Informe o nome da pasta.','error'); return; }
      const pastas = DB.get('Pastas');
      pastas.push({id: uid('f'), nome: nome.trim(), parentId: state.currentFolderId, criadaPor: u.id, criadaEm: Date.now()});
      DB.set('Pastas', pastas); fecharModal(); toast('Pasta criada — sincronizando no Google Drive…'); renderDashboard(); break;
    }
    case 'salvar-doc': {
      const titulo = ($('#mTitulo') || {}).value.trim();
      if(!titulo){ toast('Informe um título para o documento.','error'); return; }
      const docs = DB.get('Documentos');
      if(id){
        const ex = docs.find(x => x.id === id);
        if(ex && ex.tipo === 'arquivo'){
          DB.set('Documentos', docs.map(x => x.id === id ? Object.assign({}, x, {titulo:titulo, atualizadoEm:Date.now()}) : x));
          toast('Arquivo renomeado.');
        } else {
          const conteudo = ($('#mConteudo') || {}).value;
          DB.set('Documentos', docs.map(x => x.id === id ? Object.assign({}, x, {titulo:titulo, conteudo:conteudo, atualizadoEm:Date.now()}) : x));
          toast('Documento atualizado.');
        }
      } else {
        if(!permsAtuais().includes('upload')){ toast('Sem permissão de upload nesta pasta.','error'); break; }
        const conteudo = ($('#mConteudo') || {}).value;
        docs.push({id: uid('d'), pastaId: state.currentFolderId, titulo:titulo, tipo:'texto', conteudo:conteudo, criadoPor:u.id, criadoEm:Date.now(), atualizadoEm:Date.now()});
        DB.set('Documentos', docs);
        toast('Documento gravado com sucesso.');
      }
      fecharModal(); renderItens(); break;
    }
    case 'salvar-permissoes': {
      let perms = DB.get('Permissoes');
      $$('#modalCard .prow').forEach(row => {
        const userId = row.dataset.user;
        let conjunto = $$('.ptog.on', row).map(b => b.dataset.perm);
        if(conjunto.length && !conjunto.includes('visualizar')) conjunto.unshift('visualizar');
        perms = perms.filter(pp => !(pp.pastaId === id && pp.userId === userId));
        if(conjunto.length) perms.push({id: uid('p'), pastaId: id, userId: userId, perms: conjunto});
      });
      DB.set('Permissoes', perms); fecharModal(); toast('Permissões da pasta atualizadas e sincronizadas.'); renderDashboard(); break;
    }
    case 'novo-usuario':
      if(ehAdmin(u)) modalNovoUsuario();
      else toast('Apenas administradores podem criar usuários.','error');
      break;
    case 'salvar-usuario': {
      if(!ehAdmin(u)){ toast('Apenas administradores podem criar usuários.','error'); break; }
      const nome = $('#mNomeUser').value.trim(), email = $('#mEmailUser').value.trim().toLowerCase(),
            senha = $('#mSenhaUser').value, papel = $('#mPapelUser').value;
      if(!nome || !email.includes('@')){ toast('Informe nome e e-mail válidos.','error'); return; }
      if(senha.length < 6){ toast('A senha deve ter ao menos 6 caracteres.','error'); return; }
      if(getUsuarios().some(x => x.email.toLowerCase() === email)){ toast('Este e-mail já está cadastrado.','error'); return; }
      let perms = lerCheckboxes($('#modalCard'));
      if(!perms.length) perms = PRESETS.visualizador.slice();
      if(!perms.includes('visualizar')) perms.unshift('visualizar');
      const usuarios = DB.get('Usuarios');
      usuarios.push({id: uid('u'), nome:nome, email:email, senha:senha, papel:papel, perms:perms, criadoEm:Date.now()});
      DB.set('Usuarios', usuarios); fecharModal(); toast('Usuário criado.'); renderUsuarios(); break;
    }
    case 'excluir-usuario': {
      if(u.papel !== 'master'){ toast('Apenas o Master Admin pode excluir usuários.','error'); break; }
      const x = getUsuarios().find(y => y.id === id);
      modalConfirm('Excluir usuário', 'Remover o usuário <b>' + esc(x ? x.nome : '') + '</b> e suas permissões de pasta?', () => {
        DB.set('Usuarios', DB.get('Usuarios').filter(y => y.id !== id));
        DB.set('Permissoes', DB.get('Permissoes').filter(p => p.userId !== id));
        toast('Usuário excluído.'); renderUsuarios();
      }); break;
    }
    case 'salvar-senha': {
      const atual = $('#senhaAtual').value, nova = $('#senhaNova').value, conf = $('#senhaConf').value;
      if(atual !== u.senha){ toast('Senha atual incorreta.','error'); return; }
      if(nova.length < 6){ toast('A nova senha deve ter 6+ caracteres.','error'); return; }
      if(nova !== conf){ toast('A confirmação não confere.','error'); return; }
      DB.set('Usuarios', DB.get('Usuarios').map(x => x.id === u.id ? Object.assign({}, x, {senha:nova}) : x));
      ['senhaAtual','senhaNova','senhaConf'].forEach(i => $('#'+i).value = '');
      toast('Senha alterada com sucesso.'); break;
    }
    case 'copiar-script':
      navigator.clipboard.writeText(SCRIPT_GAS).then(() => toast('Código Apps Script copiado!','info')); break;
    case 'salvar-url':
      salvarUrl();
      break;
  }
});

document.addEventListener('change', e => {
  if(e.target.id === 'fileInput'){
    Array.from(e.target.files).forEach(handleUpload);
    e.target.value = '';
    return;
  }
  if(e.target.id === 'camInput' || e.target.id === 'camGallery'){
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    if(!files.length) return;
    toast('Processando imagem(ns)…','info');
    Promise.all(files.map(f => fileToJpegDataUrl(f))).then(pages => {
      camPages = camPages.concat(pages);
      renderCamPages();
      toast(pages.length + ' página(s) adicionada(s).');
    }).catch(() => toast('Não foi possível processar a imagem.','error'));
    return;
  }
  if(e.target.id === 'logoInput'){
    const f = e.target.files[0]; e.target.value = '';
    if(!f) return;
    if(!/^image\//.test(f.type)){ toast('Selecione um arquivo de imagem.','error'); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = String(reader.result);
      if(dataUrl.length > 400000){ toast('Imagem muito grande (máx. ~300 KB).','error'); return; }
      cfgLogo = dataUrl;
      const pv = $('#cfgLogoPrev'); if(pv) pv.src = cfgLogo;
      toast('Logotipo carregado — clique em "Salvar alterações".','info');
    };
    reader.readAsDataURL(f);
    return;
  }
  if(e.target.matches('.row-preset')){
    const row = e.target.closest('.prow');
    if(row && e.target.value) aplicarPresetRow(row, e.target.value);
    e.target.value = '';
    return;
  }
  if(e.target.id === 'mPapelUser'){
    const preset = PRESETS[e.target.value] || PRESETS.visualizador;
    $$('#modalCard input[data-perm]').forEach(cb => { cb.checked = preset.includes(cb.dataset.perm); });
    return;
  }
  if(e.target.matches('.select-papel') && !e.target.classList.contains('row-preset') && ehAdmin(currentUser())){
    const id = e.target.dataset.user;
    const usr = currentUser();
    if(id === usr.id){ toast('Você não pode alterar o próprio papel.','error'); renderUsuarios(); return; }
    const preset = PRESETS[e.target.value] || PRESETS.visualizador;
    DB.set('Usuarios', DB.get('Usuarios').map(x => x.id === id ? Object.assign({}, x, {papel: e.target.value, perms: preset.slice()}) : x));
    toast('Papel e permissões padrão atualizados.'); renderUsuarios();
  }
});

/* LOGIN: busca os usuários na planilha (fetch ou JSONP) antes de negar. */
$('#loginForm').addEventListener('submit', e => {
  e.preventDefault();
  const email = $('#loginEmail').value.trim().toLowerCase();
  const senha = $('#loginSenha').value;
  const tenta = () => {
    const usr = getUsuarios().find(x => x.email.toLowerCase() === email && x.senha === senha);
    if(usr){
      session = { userId: usr.id };
      store.set('rio_session', JSON.stringify(session));
      $('#loginErro').textContent = '';
      iniciarApp();
      toast('Bem-vindo(a), ' + usr.nome + '!');
      return true;
    }
    return false;
  };
  if(tenta()) return;
  if(Sync.url()){
    $('#loginErro').textContent = '';
    const st = $('#loginStatus');
    if(st){ st.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verificando usuários na planilha…'; st.className = 'login-status'; }
    Sync.pull().then(data => {
      if(data && typeof data === 'object') Sync.applyData(data);
      aplicarMarca(); mostrarLogin();
      if(!tenta()) $('#loginErro').textContent = 'E-mail ou senha inválidos.';
    }).catch(() => {
      aplicarMarca(); mostrarLogin();
      $('#loginErro').textContent = 'Não foi possível verificar a planilha. Tente novamente.';
    });
  } else {
    mostrarLogin();
    $('#loginErro').textContent = 'Nenhuma planilha configurada. Configure a URL de integração em "Sobre" para poder entrar.';
  }
});

$('#menuToggle').addEventListener('click', () => $('#sidebar').classList.toggle('open'));

/* ================= BOOT =================
   Sempre busca os dados da planilha ao abrir (logotipo, empresa, usuários).
   O login só funciona com usuários reais cadastrados na aba "Usuarios". */
try{
  seed();
  cleanupExemplos();
  migrateDados();
  if(currentUser()){ iniciarApp(); sincronizarInicial(); }
  else { mostrarLogin(); buscarDadosLogin(); }
}catch(err){
  try{ toast('Erro na inicialização: ' + err.message, 'error'); }catch(e){}
  mostrarLogin();
}
</script>
