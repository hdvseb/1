<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Documentos</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.js"></script>
<style>
:root{
  --primary:#1552c2; --primary-dark:#0e3f9e; --heading:#173f8f;
  --bg:#eef2f7; --sidebar-bg:#f5f8fc; --border:#d8e0ec;
  --text:#22314f; --muted:#6b7a99;
  --danger:#d64545; --success:#2f9e6e; --warn:#e8a13c;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:15px}
.hidden{display:none!important}
button{font-family:inherit}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border:none;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;transition:.2s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-light{background:#fff;color:var(--primary);border:1px solid var(--border)}
.btn-light:hover{background:#f2f7ff;border-color:var(--primary)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#b93636}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-block{width:100%;justify-content:center}
.btn-ic{width:34px;height:34px;border:1px solid var(--border);background:#fff;border-radius:8px;color:var(--primary);cursor:pointer;transition:.2s;display:inline-flex;align-items:center;justify-content:center;flex:0 0 34px}
.btn-ic:hover{background:#eaf2ff;border-color:var(--primary)}
.btn-ic.danger{color:var(--danger)}
.btn-ic.danger:hover{background:#fdeeee;border-color:var(--danger)}
.btn-ic.locked{color:#9aa7c0;background:#f2f5fa;cursor:not-allowed}
/* ===== login ===== */
.login-screen{min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:linear-gradient(160deg,#0b2f7d 0%,#1552c2 55%,#2f7ae0 100%);padding:24px}
.login-card{background:#fff;border-radius:16px;padding:36px 34px;width:min(430px,94vw);box-shadow:0 24px 60px rgba(0,20,60,.35);animation:fadeUp .45s ease}
.login-card img{width:210px;display:block;margin:0 auto 14px;object-fit:contain;max-height:90px}
.login-card h1{font-size:20px;color:var(--heading);text-align:center;margin-bottom:18px}
.login-status{margin:-8px 0 14px;text-align:center;font-size:12px;color:var(--muted)}
.login-status i{margin-right:5px}
.login-status.ok{color:var(--success)}
.login-status.erro{color:var(--danger)}
.campo{display:block;margin-bottom:14px;font-size:13px;font-weight:600;color:var(--heading)}
.campo input,.campo textarea,.campo select{display:block;width:100%;margin-top:6px;padding:11px 12px;border:1px solid var(--border);border-radius:8px;font:inherit;font-weight:400;color:var(--text);background:#fbfcff;transition:.2s}
.campo input:disabled{background:#eef1f6;color:#7a8aa8}
.campo input:focus,.campo textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(21,82,194,.15)}
.erro{color:var(--danger);font-size:13px;min-height:18px;margin-bottom:6px}
/* ===== shell ===== */
.topbar{height:66px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:40}
.topbar .logo-rio{height:46px;width:auto;max-width:220px;object-fit:contain}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.user-hello{color:var(--heading);font-weight:700;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-toggle{display:none;border:none;background:none;font-size:20px;color:var(--primary);cursor:pointer}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;border-radius:999px;padding:5px 11px}
.sync i{font-size:7px}
.sync.on{background:#e5f6ee;color:var(--success)}
.sync.off{background:#fdf3e2;color:var(--warn)}
.shell{display:flex;min-height:calc(100vh - 66px)}
.sidebar{width:262px;flex:0 0 262px;background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:22px 14px}
.nav-item{display:flex;align-items:center;gap:13px;width:100%;padding:13px 15px;border:none;background:none;border-radius:9px;color:var(--primary);font-weight:600;font-size:14.5px;cursor:pointer;transition:.18s;text-align:left;margin-bottom:6px}
.nav-item i{width:20px;text-align:center}
.nav-item:hover{background:#e6effc}
.nav-item.active{background:#dcebff;box-shadow:inset 3px 0 0 var(--primary)}
.main{flex:1;padding:28px 34px;overflow-y:auto}
.page-title{font-size:26px;color:var(--heading);font-weight:700;padding-bottom:14px;border-bottom:1px solid #b9c8e4;margin-bottom:22px}
.view{animation:fadeUp .35s ease}
/* ===== cards / toolbar ===== */
.card{background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 1px 3px rgba(16,42,90,.07);overflow:visible}
.card.mb{margin-bottom:20px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px 0;flex-wrap:wrap}
.card-head-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto}
.card-head h2{font-size:16.5px;color:var(--heading);display:flex;align-items:center;gap:10px}
.card-head h2 i{color:var(--primary)}
.toolbar{display:flex;gap:12px;align-items:center;padding:16px 22px;flex-wrap:wrap}
.toolbar-actions{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search-box{flex:1;min-width:220px;display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;background:#fff;padding:0 14px;height:44px;transition:.2s}
.search-box:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(21,82,194,.13)}
.search-box i{color:var(--muted)}
.search-box input{border:none;outline:none;flex:1;font:inherit;height:100%;background:transparent}
.viewmenu{position:relative}
.viewmenu-pop{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 30px rgba(10,30,70,.18);padding:6px;z-index:80;min-width:220px;display:none;max-height:340px;overflow-y:auto}
.viewmenu-pop.open{display:block;animation:pop .18s ease}
/* ===== menu de ações "três pontinhos" (usado no celular) ===== */
.item-menu{position:relative;display:inline-flex}
.item-menu>.btn-ic{width:34px;height:34px;flex:0 0 34px;background:var(--primary);border-color:var(--primary);color:#fff}
.item-menu>.btn-ic:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
.item-menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 30px rgba(10,30,70,.18);padding:6px;z-index:90;min-width:210px;display:none}
.item-menu-pop.open{display:block;animation:pop .18s ease}
.menu-line{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;text-align:left;padding:10px 12px;border-radius:8px;font:inherit;font-size:13.5px;font-weight:600;color:var(--text);cursor:pointer}
.menu-line:hover{background:#f4f8ff}
.menu-line i{width:16px;text-align:center;color:var(--primary)}
.menu-line.danger{color:var(--danger)}
.menu-line.danger i{color:var(--danger)}
.menu-line.locked{color:#9aa7c0;cursor:not-allowed}
.menu-line.locked i{color:#9aa7c0}
.vm-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:none;background:none;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--text);cursor:pointer;text-align:left}
.vm-item:hover{background:#f2f7ff}
.vm-item.active{background:#e3edff;color:var(--primary)}
.vm-item i{width:18px;text-align:center;color:var(--primary)}
.breadcrumb{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:0 22px 14px;font-size:13px}
.breadcrumb-row{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:0 22px 14px}
.breadcrumb-row .breadcrumb{padding:0}
.sel-row-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;flex-wrap:wrap}
.sel-row-btns{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.contagem-arquivos{color:var(--muted,#667085);font-size:13px;font-weight:600;white-space:nowrap}
.contagem-arquivos i{margin-right:6px}
.crumb{border:none;background:none;color:var(--primary);font-weight:600;cursor:pointer;font-size:13px;padding:4px 6px;border-radius:6px}
.crumb:hover{background:#eaf2ff}
.crumb.active{color:var(--muted);cursor:default;background:none}
.sep{color:#b6c4dd;font-size:10px}
/* ===== itens ===== */
.itens{padding:6px 12px 18px}
.item-row{display:flex;align-items:center;gap:14px;padding:13px 12px;border-radius:10px;transition:.15s;border-top:1px solid #eef2f9;flex-wrap:wrap}
.item-row:hover{background:#f4f8ff}
.lrow{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:8px;transition:.15s;border-top:1px solid #f0f4fa}
.lrow:hover{background:#f4f8ff}
.lrow .item-ic{width:30px;height:30px;font-size:13px;flex:0 0 30px;border-radius:8px}
.lrow .gname{font-weight:600;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-ic{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 42px}
.ic-pasta{background:#e3edff;color:var(--primary)}
.ic-doc{background:#e5f6ee;color:var(--success)}
.ic-pdf{background:#fdeeee;color:var(--danger)}
.ic-img{background:#e0f5f2;color:#0e8f7e}
.ic-video{background:#efe6fb;color:#7a3fd4}
.ic-audio{background:#fdf0e0;color:#d47a1a}
.ic-sheet{background:#e5f6ee;color:#217a4b}
.ic-word{background:#e3edff;color:#2b6cd4}
.ic-zip{background:#f3eee6;color:#8a6a2f}
.item-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item-info strong{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-info small{color:var(--muted);font-size:12px}
.item-desc{color:var(--muted);font-size:12.5px;white-space:normal;overflow-wrap:break-word;line-height:1.4}
.item-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chev{color:#b6c4dd;font-size:12px}
.item-row[data-action="open-folder"],.lrow[data-action="open-folder"]{cursor:pointer}
.sel-chk{width:18px;height:18px;flex:0 0 18px;cursor:pointer;accent-color:var(--primary)}
.item-row.sel-row,.lrow.sel-row{background:#eaf2ff}
.gcard{position:relative}
.gcard .sel-chk{position:absolute;top:8px;left:8px;z-index:2}
.gcard.sel-row{box-shadow:0 0 0 2px var(--primary) inset}
.sel-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 22px;background:#eaf2ff;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.sel-bar .sel-count{font-weight:700;color:var(--primary);font-size:13.5px;display:flex;align-items:center;gap:6px;margin-right:auto}

.itens-grid{display:grid;gap:12px;padding:12px 16px 18px}
.mode-xg{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.mode-g{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.mode-m{grid-template-columns:repeat(auto-fill,minmax(138px,1fr))}
.mode-p{grid-template-columns:repeat(auto-fill,minmax(106px,1fr));gap:8px}
.gcard{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;transition:.15s}
.gcard:hover{box-shadow:0 8px 20px rgba(16,42,90,.12);transform:translateY(-1px)}
.gcard[data-action="open-folder"]{cursor:pointer}
.gcard .item-ic{width:64px;height:64px;font-size:27px;flex-basis:64px}
.mode-g .gcard .item-ic{width:52px;height:52px;font-size:22px;flex-basis:52px}
.mode-m .gcard .item-ic{width:42px;height:42px;font-size:18px;flex-basis:42px}
.mode-m .gcard{padding:12px 8px 10px}
.mode-p .gcard{padding:10px 6px 8px;gap:6px}
.mode-p .gcard .item-ic{width:30px;height:30px;font-size:14px;flex-basis:30px;border-radius:8px}
.gname{font-weight:700;color:var(--text);font-size:13.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mode-xg .gname{font-size:15px}
.mode-p .gname{font-size:11px;font-weight:600}
.gsmall{color:var(--muted);font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mode-m .gsmall,.mode-p .gsmall{display:none}
.gcard-actions{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.gcard-actions .btn-ic{width:28px;height:28px;flex-basis:28px;font-size:12px}
.mode-p .gcard-actions .btn-ic{width:24px;height:24px;flex-basis:24px;font-size:11px}
.mode-xg .gcard-actions .btn-ic{width:32px;height:32px;flex-basis:32px}
.vazio{padding:44px 20px;text-align:center;color:var(--primary);grid-column:1/-1}
.vazio i{font-size:30px;opacity:.55;display:block;margin-bottom:10px}
.tag{font-size:11px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.tag-admin{background:#e6e0fb;color:#5b3fd4}
.tag-edit{background:#e3edff;color:var(--primary)}
.tag-down{background:#e0f5f2;color:#0e8f7e}
.tag-view{background:#eef1f6;color:#5c6c8c}
.tag-info{background:#e3edff;color:var(--primary);display:inline-flex;align-items:center;gap:6px}
.tag-arq{background:#eef1f6;color:#41537a;display:inline-flex;align-items:center;gap:5px}
.mini-perms{display:inline-flex;gap:7px;flex-wrap:wrap}
.mini-perms i{color:#5c76a8;font-size:12px}
/* ===== tabela ===== */
.table-wrap{overflow-x:auto;padding:14px 22px 22px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--heading);text-align:left;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;padding:10px 12px;border-bottom:2px solid #dbe5f3}
td{padding:12px;border-bottom:1px solid #edf1f7;vertical-align:middle}
.tr-right{text-align:right}
.cell-user{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 36px}
.select-papel{padding:7px 9px;border:1px solid var(--border);border-radius:7px;font:inherit;font-size:13px;color:var(--text);background:#fff}
.select-papel:disabled{background:#eef1f6;color:#7a8aa8}
/* ===== modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(8,20,45,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:18px;animation:fade .2s}
.modal-card{background:#fff;border-radius:14px;width:min(1060px,96vw);max-height:92vh;overflow-y:auto;padding:26px 26px 22px;animation:pop .25s ease;box-shadow:0 30px 70px rgba(0,10,40,.35)}
.modal-card h3{color:var(--heading);font-size:17px;margin-bottom:6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.modal-card h3 i{color:var(--primary)}
.modal-sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.modal-msg{margin:10px 0 18px;color:var(--text)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}
.ic-danger{color:var(--danger)!important}
.passos{margin:0 0 14px 20px;color:var(--text);font-size:14px;line-height:1.9}
/* ===== editores ===== */
.w-toolbar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;align-items:center}
.w-toolbar .btn-ic{width:32px;height:32px;flex-basis:32px}
.word-editor{min-height:300px;max-height:48vh;overflow:auto;background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px 20px;font-size:14px;line-height:1.7}
.word-editor:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(21,82,194,.12)}
.word-editor h1,.word-editor h2,.word-editor h3{margin:12px 0 8px;color:var(--heading)}
.word-editor p{margin:0 0 10px}
.word-editor ul,.word-editor ol{margin:0 0 10px 22px}
.word-editor table{border-collapse:collapse;width:100%}
.word-editor td,.word-editor th{border:1px solid var(--border);padding:6px 8px}
.sheet-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.stab{border:1px solid var(--border);background:#fff;border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.stab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.sheet-editor-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;padding:8px;background:#fff;max-height:52vh}
.sheet-table{border-collapse:collapse;font-size:12.5px}
.sheet-table th{background:#e3edff;color:var(--heading);text-align:left}
.sheet-table th,.sheet-table td{border:1px solid var(--border);padding:5px 8px;white-space:nowrap}
.sheet-table.edit td[contenteditable="true"]{min-width:90px;cursor:text}
.sheet-table.edit td[contenteditable="true"]:focus{outline:2px solid var(--primary);outline-offset:-2px;background:#f4f8ff}
.sheet-table .rn{background:#eef2f8;color:var(--muted);font-size:11px;text-align:center;min-width:36px;user-select:none}
/* câmera */
.cam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:10px 0}
.cam-item{position:relative}
.cam-item img{width:100%;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--border);display:block}
.cam-item .btn-ic{position:absolute;top:-9px;right:-9px}
/* ===== permissões da pasta ===== */
.perm-topbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 0 12px}
.perm-topbar .search-box{height:40px;min-width:200px}
.perm-bulk{display:flex;gap:8px;flex-wrap:wrap}
.perm-bulk button{border:1px solid var(--border);background:#fff;color:var(--primary);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer}
.perm-bulk button:hover{background:var(--primary);color:#fff}
.perm-scroll{max-height:52vh;overflow-y:auto;padding-right:6px}
.perm-scroll::-webkit-scrollbar{width:8px}
.perm-scroll::-webkit-scrollbar-thumb{background:#c4d1e6;border-radius:8px}
.prow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:#fff;flex-wrap:wrap;transition:.15s}
.prow:hover{border-color:#b9cdec;box-shadow:0 3px 10px rgba(16,42,90,.08)}
.prow .perm-user{flex:1;min-width:200px;display:flex;flex-direction:column;gap:3px}
.prow .perm-user small{color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.prow .avatar{width:34px;height:34px;flex-basis:34px;font-size:12px}
.prow-left{display:flex;align-items:center;gap:10px;flex:1;min-width:220px}
.ptogs{display:flex;gap:6px;flex-wrap:wrap}
.ptog{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:#fff;color:#a5b2ca;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:13px;transition:.15s;flex:0 0 32px}
.ptog:hover{border-color:var(--primary);color:var(--primary)}
.ptog.on{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 2px 6px rgba(21,82,194,.35)}
.perm-legenda{display:flex;gap:10px;flex-wrap:wrap;padding:10px 2px 2px;color:var(--muted);font-size:11.5px}
.perm-legenda i{color:var(--primary);width:14px;text-align:center;margin-right:3px}
/* ===== checkboxes ===== */
.perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.chk{display:flex;align-items:center;gap:9px;border:1px solid var(--border);border-radius:8px;padding:9px 11px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text);background:#fbfcff;transition:.15s}
.chk:hover{border-color:var(--primary);background:#f4f8ff}
.chk input{accent-color:var(--primary);width:15px;height:15px;cursor:pointer}
.chk i{color:var(--primary);width:16px;text-align:center}
.preset-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.preset-row button{border:1px solid var(--border);background:#fff;color:var(--primary);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
.preset-row button:hover{background:var(--primary);color:#fff}
.doc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.doc-meta{display:flex;flex-wrap:wrap;gap:14px;color:var(--muted);font-size:12.5px;margin:10px 0 14px;padding:10px 12px;background:#f5f8fc;border-radius:8px}
.doc-meta i{margin-right:5px;color:var(--primary)}
.doc-body{white-space:pre-wrap;background:#fbfcff;border:1px solid var(--border);border-radius:10px;padding:18px;font-size:14px;line-height:1.65}
.doc-body.docx-view,.doc-body.sheet-view{white-space:normal;background:#fff}
.docx-view h1,.docx-view h2,.docx-view h3{margin:14px 0 8px;color:var(--heading)}
.docx-view p{margin:0 0 10px}
.docx-view ul,.docx-view ol{margin:0 0 10px 22px}
.docx-view img{max-width:100%}
.docx-view table{border-collapse:collapse;width:100%;margin-bottom:10px}
.docx-view td,.docx-view th{border:1px solid var(--border);padding:6px 8px;font-size:13px}
.table-x{overflow:visible;max-height:none;margin-bottom:12px}
.sheet-title{margin:14px 0 6px;color:var(--heading);font-size:14px}
.pdf-frame{width:100%;height:70vh;max-height:calc(92vh - 220px);border:1px solid var(--border);border-radius:10px;background:#525659;display:block}
.pdf-restrito{height:70vh;max-height:calc(92vh - 220px);overflow-y:auto;background:#525659;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:12px;align-items:center;user-select:none;-webkit-user-select:none}
.pdf-restrito .pdf-page{max-width:100%;height:auto;box-shadow:0 6px 18px rgba(0,0,0,.45);border-radius:2px;pointer-events:none}
.restrito-aviso{width:100%;display:flex;align-items:center;gap:10px;background:rgba(21,82,194,.92);color:#fff;font-size:12.5px;font-weight:700;border-radius:8px;padding:9px 12px;flex:0 0 auto}
.prev-img{display:block;margin:0 auto;max-width:100%;border-radius:10px;border:1px solid var(--border)}
.prev-media{width:100%;max-height:56vh;border-radius:10px;background:#000}
.no-prev{padding:44px 20px;text-align:center;background:#f5f8fc;border-radius:10px;color:var(--muted)}
.no-prev i{font-size:44px;display:block;margin-bottom:12px;color:#9fb2d3}
/* ITEM: a barra de rolagem do MODAL (fora) rolava o card inteiro (título,
   metadados, ações), mas a pré-visualização (iframe do Drive/PDF) tem altura
   fixa e cuidava da própria rolagem por dentro — duas barras de rolagem
   "competindo" faziam parecer que dava pra rolar mas o conteúdo de baixo do
   documento nunca aparecia. Quando o modal é de visualização de documento
   (classe .modal-doc-view), o card vira uma coluna flex: cabeçalho e botões
   ficam fixos, e só a área de pré-visualização (.doc-viewer-corpo) rola,
   ocupando todo o espaço restante — sem disputa entre duas barras.  */
.modal-card.modal-doc-view{display:flex;flex-direction:column;max-height:92vh;overflow:hidden}
.modal-card.modal-doc-view>*{flex:0 0 auto}
.modal-card.modal-doc-view .doc-viewer-corpo{flex:1 1 auto;min-height:240px;overflow-y:auto;margin-bottom:14px}
.modal-card.modal-doc-view .doc-viewer-corpo .pdf-frame,
.modal-card.modal-doc-view .doc-viewer-corpo .pdf-restrito{height:100%;max-height:none}
/* ===== configurações ===== */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cfg-body{padding:18px 22px}
.cfg-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.logo-prev-wrap{background:#f5f8fc;border:1px dashed var(--border);border-radius:10px;padding:18px;display:flex;align-items:center;justify-content:center;min-height:130px}
.logo-prev-wrap img{max-width:230px;max-height:110px;object-fit:contain}
.fmt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;margin:12px 0}
.fmt-grid .chk{padding:8px 10px;font-size:12.5px}
.empresa-resumo{display:flex;flex-direction:column;gap:8px;font-size:14px;color:#3c4c6e}
.empresa-resumo i{color:var(--primary);width:18px;text-align:center;margin-right:6px}
/* ===== perfil / sobre ===== */
.perfil-top{display:flex;align-items:center;gap:18px;padding:22px}
.avatar-lg{width:74px;height:74px;border-radius:50%;background:var(--primary);color:#fff;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center}
.perfil-nome{font-size:19px;color:var(--heading)}
.sobre-texto{padding:14px 22px 20px;color:#3c4c6e;line-height:1.7;font-size:14px}
.integ-row{display:flex;gap:10px;padding:0 22px 22px;flex-wrap:wrap}
.integ-row input{flex:1;min-width:240px;padding:11px 13px;border:1px solid var(--border);border-radius:8px;font:inherit;font-size:13px}
.integ-row input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(21,82,194,.13)}
.code{background:#0f2557;color:#d7e4ff;border-radius:10px;margin:0 22px 22px;padding:16px;font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.6;max-height:340px;overflow:auto;white-space:pre}
/* ===== toasts ===== */
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:200}
.toast{display:flex;align-items:center;gap:10px;background:#fff;border-radius:10px;padding:12px 16px;box-shadow:0 10px 30px rgba(10,30,70,.2);font-size:14px;font-weight:600;animation:slideIn .3s ease;border-left:4px solid var(--success);min-width:250px}
.toast i{color:var(--success)}
.toast.error{border-left-color:var(--danger)} .toast.error i{color:var(--danger)}
.toast.info{border-left-color:var(--primary)} .toast.info i{color:var(--primary)}
.toast.saindo{opacity:0;transform:translateX(20px);transition:.3s}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@media(max-width:960px){
  .menu-toggle{display:block}
  .sidebar{position:fixed;left:0;top:66px;bottom:0;z-index:60;transform:translateX(-105%);transition:.28s;box-shadow:20px 0 40px rgba(0,20,60,.15)}
  .sidebar.open{transform:none}
  .main{padding:20px 16px}
  .grid-2,.cfg-cols,.perm-grid{grid-template-columns:1fr}

}

  .login-card img{width:170px;max-height:74px}
  .login-card h1{font-size:18px;margin-bottom:14px}
  .topbar{padding:0 12px;gap:8px;height:58px}
  .topbar .logo-rio{height:36px}
  .shell{min-height:calc(100vh - 58px)}
  .sidebar{top:58px}
  .main{padding:16px 12px}
  .page-title{font-size:21px}
  .card-head{padding:14px 14px 0}
  .toolbar{padding:12px 14px}
  .search-box{min-width:0;width:100%;flex-basis:100%}
  .toolbar-actions{margin-left:0;width:100%;justify-content:flex-end}
  .breadcrumb{padding:0 14px 10px}
  .breadcrumb-row{padding:0 14px 10px}
  .itens,.itens-grid{padding:8px 8px 14px}
  .btn{padding:9px 12px;font-size:13px}
  .modal-overlay{padding:10px}
  .modal-card{padding:18px 14px;width:100vw}
  .modal-actions{justify-content:stretch}
  .modal-actions .btn{flex:1;justify-content:center}
  .prow{flex-direction:column;align-items:stretch}
  .prow-left{min-width:0}
  .perm-topbar{flex-direction:column;align-items:stretch}
  .perm-topbar .search-box{width:100%}
  .doc-meta{gap:8px;font-size:11.5px}
  .table-wrap{padding:10px 12px 14px}
  .cfg-body{padding:14px}
  .sobre-texto{padding:12px 14px 16px}
  .integ-row{padding:0 14px 16px}
  .code{margin:0 14px 14px}
  #toasts{left:12px;right:12px}
  .toast{min-width:0;width:100%}
}
</style>
</head>
<body>

<!-- ==================== LOGIN ==================== -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <img id="loginLogo" alt="Logotipo" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==">
    <h1>Gestão de Documentos</h1>
    <div id="loginStatus" class="login-status hidden"></div>
    <form id="loginForm" autocomplete="off">
      <label class="campo">E-mail institucional
        <input id="loginEmail" type="email" required>
      </label>
      <label class="campo">Senha
        <input id="loginSenha" type="password" required>
      </label>
      <div id="loginErro" class="erro"></div>
      <button class="btn btn-primary btn-block" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Entrar</button>
    </form>
  </div>
</div>

<!-- ==================== APP ==================== -->
<div id="app" class="hidden">
  <header class="topbar">
    <button class="menu-toggle" id="menuToggle" title="Menu"><i class="fa-solid fa-bars"></i></button>
    <img class="logo-rio" id="logoRio" alt="Logotipo" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==">
    <div class="topbar-right">
      <span id="syncBadge" style="display:none"></span>
      <span class="user-hello" id="userName"></span>
      <button class="btn btn-primary" data-action="logout"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
    </div>
  </header>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <nav id="sideNav"></nav>
    </aside>
    <main class="main"><div id="viewRoot"></div></main>
  </div>
</div>

<div id="modalOverlay" class="modal-overlay hidden"><div class="modal-card" id="modalCard"></div></div>
<div id="toasts"></div>

<script>
/* ================= UTILITÁRIOS ================= */
const $  = (s, r) => (r||document).querySelector(s);
const $$ = (s, r) => Array.from((r||document).querySelectorAll(s));
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const fmtData = ts => { if(!ts) return ''; const d = new Date(ts); if(isNaN(d)) return ''; return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); };
const fmtTam = b => b < 1024 ? b + ' B' : b < 1048576 ? (b/1024).toFixed(1) + ' KB' : (b/1048576).toFixed(1) + ' MB';
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function sanitizarHtmlGerado_(html){
  const tpl=document.createElement('template');tpl.innerHTML=String(html||'');
  tpl.content.querySelectorAll('script,iframe,object,embed,form,link,meta,style').forEach(n=>n.remove());
  tpl.content.querySelectorAll('*').forEach(n=>{
    Array.from(n.attributes).forEach(a=>{
      const k=a.name.toLowerCase(),v=a.value||'';
      if(k.indexOf('on')===0||k==='srcdoc'||k==='style'||(k==='href'&&/^\s*javascript:/i.test(v))||(k==='src'&&!/^\s*(https?:|data:image\/)/i.test(v)))n.removeAttribute(a.name);
    });
    if(n.tagName==='A'){const h=n.getAttribute('href')||'';if(!/^\s*https?:/i.test(h))n.removeAttribute('href');else{n.setAttribute('rel','noopener noreferrer');n.setAttribute('target','_blank');}}
  });
  return tpl.innerHTML;
}
const iniciais = n => String(n||'?').split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
const PAPEIS  = { master:'Master Admin', admin:'Administrador', editor:'Editor', visualizador:'Leitor' };
const FOLHAS  = ['Usuarios','Pastas','Permissoes','Documentos','Empresa'];
const PLACEHOLDER_LOGO = document.getElementById('loginLogo').src;
const DEFAULT_FORMATS = ['pdf','txt','md','log','json','csv','xml','doc','docx','odt','xls','xlsx','ods','ppt','pptx','mp4','webm','mov','m4v','mp3','wav','ogg','m4a','png','jpg','jpeg','gif','webp','svg','bmp','zip','rar','7z'];
const APP_VERSAO = 33;
const BUILD_ID = 'SGD-GITHUB-V32-LOGIN-LEGADO-COMPATIVEL';

// A URL do backend não é mais digitável/editável no app (removido da
// antiga tela "Sobre" — era a causa de vários "não conecta" quando ficava
// uma URL antiga gravada no navegador). Agora ela SÓ existe em Code.gs: o
// próprio Apps Script injeta sua URL de implantação atual aqui no momento
// em que serve esta página (a implantação /exec definida no backend). Se esta página for aberta de outra forma (fora do Apps
// Script), o placeholder abaixo não é substituído e o app fica sem URL —
// é esperado: não existe mais um caminho de configurar isso pelo navegador.
// IMPORTANTE: a linha abaixo contém a ÚNICA tag de template válida deste
// arquivo (scriptlet do HtmlService). Não deve existir nenhuma outra
// ocorrência das sequências de abertura/fechamento de scriptlet em nenhum
// outro lugar deste arquivo (nem em comentários, nem dentro de textos) —
// o HtmlService varre o arquivo INTEIRO à procura delas, e uma ocorrência
// perdida vira um "SyntaxError: Invalid or unexpected token" ao publicar.
const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbxWd5Koielaa9VtbgYzMuBYIVPen8NFBlJMS3_52QY1U0nZXUCo1Qk7O8g7ezJiNRmHbA/exec';
const RPC_DISPONIVEL = !!DEFAULT_GAS_URL;
// REMOÇÃO (item 10): a busca automática de GAS_URL na aba "Settings" via
// exportação CSV pública (gviz/tq) foi removida. Ela dependia da planilha
// estar compartilhada como "qualquer pessoa com o link pode visualizar",
// o que exporia as demais abas (inclusive "Usuarios") a qualquer pessoa com
// a URL da planilha — não só a aba "Settings". Além disso, isso era
// redundante na prática: só gerava erros de CORS no console (a planilha não
// é pública) e atrasava a inicialização com até 5 tentativas sequenciais.
// REMOÇÃO (posterior): a URL também não é mais editável pelo navegador
// (a antiga tela "Sobre" foi removida — os controles de integração que
// restaram, como "Verificar versão" e "Copiar código", passaram para
// "Configurações") — era fonte recorrente de "não consigo conectar" quando
// ficava uma URL antiga esquecida ali. Agora a URL de integração vem só de
// Code.gs, injetada automaticamente nesta página no momento em que o Apps
// backend e frontend usam a mesma implantação /exec.
const store = {
  _m: {},
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return (k in this._m) ? this._m[k] : null; } },
  set(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ this._m[k] = v; return false; } }
};
function guardarFolhaSeguro(f, rows){
  if(store.set('rio_'+f, JSON.stringify(rows))) return true;
  try{
    const slim = rows.map(r => (r && typeof r.arquivo === 'string' && r.arquivo.length > 900000) ? Object.assign({}, r, {arquivo:''}) : r);
    return store.set('rio_'+f, JSON.stringify(slim));
  }catch(e){ return false; }
}
// CORREÇÃO (item 9): mesmo princípio da correção no servidor — antes, o
// merge de uma linha do servidor sobre a linha local substituía o objeto
// INTEIRO. Se em algum momento o servidor devolvesse uma versão da linha
// sem "driveId"/"arquivo" (ex.: durante uma corrida de push, ou uma janela
// antes do backend corrigido entrar no ar), o merge local apagava também a
// cópia de segurança que só existia no navegador. Agora o merge é por
// campo: o servidor continua "ganhando" para os campos que ele de fato
// devolveu, mas um campo que só existe localmente (e não veio na resposta
// do servidor) é preservado em vez de apagado.
function mesclarRows(localRows, serverRows){
  const mapLocal = new Map();
  (localRows||[]).forEach(r => { if(r && r.id) mapLocal.set(r.id, r); });
  const mapFinal = new Map();
  (serverRows||[]).forEach(r => {
    if(!r || !r.id) return;
    const loc = mapLocal.get(r.id);
    mapFinal.set(r.id, loc ? Object.assign({}, loc, r) : r);
    mapLocal.delete(r.id);
  });
  mapLocal.forEach((r, id) => mapFinal.set(id, r));
  return Array.from(mapFinal.values());
}
function formatosPermitidos(){
  const f = getEmpresa().formats;
  return (Array.isArray(f) && f.length) ? f : DEFAULT_FORMATS;
}
function acceptString(){ return '.' + formatosPermitidos().join(',.'); }
function formatoVisivel(d, u){
  if(!d || d.tipo !== 'arquivo') return true;
  if(ehAdmin(u)) return true;
  return formatosPermitidos().includes((d.ext || '').toLowerCase());
}
function colLetter(n){ let s=''; n++; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }

/* ===== EMPRESA (sem dados de exemplo: tudo vem da planilha) ===== */
const EMPRESA_PADRAO = {
  nome:'', fantasia:'', cnpj:'', endereco:'', cidade:'', cep:'',
  telefone:'', email:'', site:'', responsavel:'', logo:'', formats: DEFAULT_FORMATS.slice()
};
let empresaMemoria = null;
function getEmpresa(){ return Object.assign({}, EMPRESA_PADRAO, empresaMemoria || {}, DB.get('Empresa')[0] || {}); }
function setEmpresa(obj){ empresaMemoria = Object.assign({}, obj || {}); guardarFolhaSeguro('Empresa', [empresaMemoria]); Sync.push('Empresa', [empresaMemoria]); }

/* ===== PERMISSÕES ===== */
const PERMS_LIST = [
  {k:'visualizar',   label:'Visualizar',   ic:'fa-eye'},
  {k:'editar',       label:'Editar',       ic:'fa-pen'},
  {k:'excluir',      label:'Excluir',      ic:'fa-trash-can'},
  {k:'imprimir',     label:'Imprimir',     ic:'fa-print'},
  {k:'upload',       label:'Upload',       ic:'fa-upload'},
  {k:'download',     label:'Download',     ic:'fa-download'},
  {k:'criar_pasta',  label:'Criar pasta',  ic:'fa-folder-plus'},
  {k:'excluir_pasta',label:'Excluir pasta',ic:'fa-folder-minus'}
];
const ALL_PERMS = PERMS_LIST.map(p => p.k);
const PRESETS = {
  visualizador: ['visualizar','imprimir','download'],
  editor:       ['visualizar','editar','excluir','imprimir','upload','download','criar_pasta'],
  completo:     ALL_PERMS.slice()
};
const LEGACY_NIVEL = {
  'ver':    ['visualizar','imprimir'],
  'baixar': ['visualizar','imprimir','download'],
  'editar': PRESETS.editor
};
function normPermRow(p){
  if(p && typeof p === 'object' && Array.isArray(p.perms)) return p;
  const base = (p && typeof p === 'object') ? p : {};
  return Object.assign({}, base, {perms: (LEGACY_NIVEL[base.nivel] || ['visualizar']).slice()});
}
function normUserRow(u){
  if(u && typeof u === 'object' && Array.isArray(u.perms)) return u;
  const base = (u && typeof u === 'object') ? u : {id: uid('u'), nome:'?', email:'?'};
  const def = (base.papel === 'admin' || base.papel === 'master') ? ALL_PERMS.slice()
            : (PRESETS[base.papel] || PRESETS.visualizador).slice();
  return Object.assign({}, base, {perms: def});
}
function presetSet(nome){
  if(nome === 'leitor' || nome === 'visualizador') return PRESETS.visualizador;
  if(nome === 'editor') return PRESETS.editor;
  if(nome === 'completo') return PRESETS.completo;
  return [];
}
function permsCheckboxes(atual){
  return '<div class="perm-grid">' + PERMS_LIST.map(p =>
    '<label class="chk"><input type="checkbox" data-perm="' + p.k + '"' + (atual.includes(p.k) ? ' checked' : '') + '><i class="fa-solid ' + p.ic + '"></i> ' + p.label + '</label>'
  ).join('') + '</div>';
}
function lerCheckboxes(rootEl){ return $$('input[data-perm]:checked', rootEl).map(i => i.dataset.perm); }
function icoPerms(perms){
  return '<span class="mini-perms">' + PERMS_LIST.filter(p => (perms||[]).includes(p.k)).map(p =>
    '<i class="fa-solid ' + p.ic + '" title="' + p.label + '"></i>').join('') + '</span>';
}

/* ===== categorias ===== */
const CATS = {
  pdf:  {exts:['pdf'], ic:'fa-file-pdf',      cls:'ic-pdf',   rot:'PDF'},
  img:  {exts:['png','jpg','jpeg','gif','webp','svg','bmp'], ic:'fa-file-image', cls:'ic-img', rot:'Imagem'},
  video:{exts:['mp4','webm','mov','m4v','mkv'], ic:'fa-file-video', cls:'ic-video', rot:'Vídeo'},
  audio:{exts:['mp3','wav','ogg','m4a'], ic:'fa-file-audio', cls:'ic-audio', rot:'Áudio'},
  sheet:{exts:['xls','xlsx','csv','ods'], ic:'fa-file-excel', cls:'ic-sheet', rot:'Planilha'},
  word: {exts:['doc','docx','odt'], ic:'fa-file-word', cls:'ic-word', rot:'Word'},
  zip:  {exts:['zip','rar','7z','tar','gz'], ic:'fa-file-zipper', cls:'ic-zip', rot:'Compactado'},
  txt:  {exts:['txt','md','log','json','xml'], ic:'fa-file-lines', cls:'ic-doc', rot:'Texto'},
  outro:{exts:[], ic:'fa-file', cls:'ic-doc', rot:'Arquivo'}
};
function categoria(d){
  if(!d) return 'outro';
  if(d.tipo === 'texto') return 'txt';
  for(const k in CATS){ if(k !== 'outro' && CATS[k].exts.includes((d.ext||'').toLowerCase())) return k; }
  return 'outro';
}
function catInfo(d){ return CATS[categoria(d)]; }

/* ============ DB / SYNC ============ */
const DB = {
  get(f){ try{ const raw = store.get('rio_'+f); return raw ? JSON.parse(raw) : []; }catch(e){ return []; } },
  set(f, rows){ guardarFolhaSeguro(f, rows); Sync.push(f, rows); }
};
/* ============ TOMBSTONES (evita que exclusões "ressuscitem" numa sincronização em andamento) ============
   Quando algo é excluído, o app manda a lista atualizada para a planilha, mas essa gravação é
   assíncrona. Se uma sincronização (pull) ocorrer antes dela terminar, o servidor ainda responde com o
   item "excluído" presente, e a mesclagem local+servidor o traz de volta. Para evitar isso, guardamos
   por alguns minutos quais ids foram excluídos e os ignoramos em qualquer mesclagem nesse período. */
const TOMBSTONE_MS = 3 * 60 * 1000;
const tombstones = {};
function marcarExcluido_(folha, ids){
  const arr = Array.isArray(ids) ? ids : [ids];
  if(!arr.length) return;
  if(!tombstones[folha]) tombstones[folha] = new Map();
  const now = Date.now();
  arr.forEach(id => { if(id) tombstones[folha].set(id, now); });
}
function filtrarTombstones_(folha, rows){
  const m = tombstones[folha];
  if(!m || !m.size || !Array.isArray(rows)) return rows;
  const now = Date.now();
  return rows.filter(r => {
    if(!r || !r.id) return true;
    const t = m.get(r.id);
    if(t === undefined) return true;
    if(now - t > TOMBSTONE_MS){ m.delete(r.id); return true; }
    return false;
  });
}
let pullTimer = null;
// ITEM 6: antes, agendarPull disparava um único pull 3.5s depois do push e
// parava por aí — se o servidor ainda não tivesse terminado de gravar o
// driveId (upload em lote, fila do LockService, etc.), a mensagem "Enviando
// para o Drive…" ficava travada pra sempre na tela, mesmo com o arquivo já
// salvo no Drive, até o usuário fazer alguma outra ação que reagendasse um
// pull. Agora, enquanto existir algum arquivo sem driveId/erroUpload,
// continuamos reagendando o pull automaticamente até o status ser resolvido.
function existeUploadPendente_(){
  return DB.get('Documentos').some(d => d.tipo === 'arquivo' && !d.driveId && !d.erroUpload);
}
function agendarPull(){
  if(!Sync.url()) return;
  clearTimeout(pullTimer);
  pullTimer = setTimeout(() => {
    Sync.pull().then(data => {
      if(Sync.applyData(data)){
        if(!$('#modalOverlay') || $('#modalOverlay').classList.contains('hidden')){
          if(currentUser()) renderApp();
          else { if(session && session.token) gasCall_('apiLogout',[session.token]).catch(()=>{}); limparSessao_(); mostrarLogin(); }
        }
      }
      if(existeUploadPendente_()) agendarPull();
    }).catch(() => { if(existeUploadPendente_()) agendarPull(); });
  }, 3500);
}
const JSONP_TIMEOUT_MS = 25000;
let jsonpSeq = 0;
/*
 * Comunicação GitHub Pages -> Apps Script.
 *
 * IMPORTANTE: para login, leitura da planilha e ações normais usamos SOMENTE
 * JSONP. O fallback por iframe/POST foi removido porque é justamente ele que
 * provoca o aviso "Permitir acesso de rede?" em ambientes de pré-visualização
 * e em alguns navegadores.
 *
 * Upload de arquivo continua usando POST em iframe separadamente, pois o
 * payload pode conter base64 e não deve ser colocado na URL.
 */
function gasCall_(fn,args){
  args=args||[];
  if(!DEFAULT_GAS_URL) return Promise.reject(new Error('URL do Apps Script não configurada.'));
  return new Promise((resolve,reject)=>{
    const cb='__hddocs_jsonp_'+Date.now()+'_'+(++jsonpSeq);
    const script=document.createElement('script');
    let done=false;
    const timer=setTimeout(()=>finish(new Error('Tempo esgotado ao consultar o Apps Script. Verifique se a implantação do Apps Script está publicada para "Qualquer pessoa".')),JSONP_TIMEOUT_MS);
    function cleanup(){
      clearTimeout(timer);
      try{script.remove();}catch(e){}
      try{delete window[cb];}catch(e){window[cb]=undefined;}
    }
    function finish(err,data){
      if(done)return; done=true; cleanup();
      if(err)reject(err);else resolve(data);
    }
    window[cb]=data=>finish(null,data);
    script.onerror=()=>finish(new Error('Não foi possível acessar o Apps Script pelo canal JSONP. Verifique a implantação/publicação da URL /exec.'));
    const q=new URLSearchParams();
    q.set('api','1');
    q.set('fn',fn);
    q.set('args',JSON.stringify(args));
    q.set('callback',cb);
    q.set('_',String(Date.now()));
    script.async=true;
    script.src=DEFAULT_GAS_URL + (DEFAULT_GAS_URL.indexOf('?')>=0?'&':'?') + q.toString();
    document.head.appendChild(script);
  });
}
/* POST é reservado exclusivamente para upload de arquivos. */
function postApi_(payload){
  if(!DEFAULT_GAS_URL) return Promise.reject(new Error('URL do Apps Script não configurada.'));
  return new Promise((resolve,reject)=>{
    const id='post_'+Date.now()+'_'+(++jsonpSeq);
    payload=Object.assign({},payload,{requestId:id});
    const iframe=document.createElement('iframe');
    iframe.name=id; iframe.id=id; iframe.style.display='none';
    iframe.setAttribute('aria-hidden','true');
    document.body.appendChild(iframe);
    const form=document.createElement('form');
    form.method='POST'; form.action=DEFAULT_GAS_URL; form.target=id; form.style.display='none';
    const input=document.createElement('textarea');
    input.name='payload'; input.value=JSON.stringify(payload); input.style.display='none';
    form.appendChild(input); document.body.appendChild(form);
    let done=false;
    const timer=setTimeout(()=>finish(new Error('Tempo esgotado ao enviar o arquivo para o Apps Script.')),120000);
    function finish(err,data){
      if(done)return; done=true; clearTimeout(timer); window.removeEventListener('message',onMessage);
      try{form.remove();iframe.remove();}catch(e){}
      if(err)reject(err);else resolve(data);
    }
    function onMessage(ev){
      const d=ev&&ev.data;
      if(!d||d.type!=='hddocs-api-result'||d.id!==id)return;
      finish(null,d.data);
    }
    window.addEventListener('message',onMessage);
    try{form.submit();}catch(e){finish(e);}
  });
}
function chamarAcaoGet_(params){
  params=params||{};
  if(params.acao==='escanearPendentes'||params.acao==='verificarOrfaos') return gasCall_('apiAction',[Object.assign({},params,{token:session?session.token:''})]);
  return Promise.reject(new Error('Ação não suportada.'));
}
let backendAntigo = false;
/* CORREÇÃO (item 8): antes, cada Sync.push disparava um fetch imediatamente,
   sem esperar o anterior da mesma aba terminar. Se duas chamadas saíssem
   quase juntas, a ordem de chegada no servidor não era garantida — e o push
   mais "atrasado" podia sobrescrever no Sheets o resultado do mais recente.
   Agora enfileiramos os pushes por aba: o próximo só é enviado depois que o
   anterior da mesma aba retornar. Isso é um reforço no cliente — a correção
   definitiva (merge por id) está no servidor, no Code.gs. */
const filaPush_ = {};
function corpoComUsuario_(extra){ return Object.assign({token:session?session.token:''},extra||{}); }
const Sync = {
  url(){ return !!DEFAULT_GAS_URL; },
  push(f,rows){
    if(!session||!DEFAULT_GAS_URL)return;
    let out=rows;
    if(f==='Documentos')out=rows.map(r=>{if(!r.arquivo)return r;const c=Object.assign({},r);delete c.arquivo;return c;});
    const body=corpoComUsuario_({folha:f,rows:out}),anterior=filaPush_[f]||Promise.resolve();
    filaPush_[f]=anterior.then(()=>gasCall_('apiPush',[body])).catch(()=>{});
    if(f==='Documentos')agendarPull();
  },
  pushAll(){if(session)FOLHAS.forEach(f=>this.push(f,DB.get(f)));},
  uploadArquivo(payload){
    if(!session||!DEFAULT_GAS_URL)return Promise.reject(new Error('sessão indisponível'));
    const anterior=filaPush_['Documentos']||Promise.resolve();
    const p=anterior.then(()=>postApi_({fn:'apiUploadArquivo',payload:corpoComUsuario_(payload)}));
    p.then(()=>agendarPull()).catch(()=>agendarPull());return p;
  },
  ensureDriveRoot(){const u=currentUser();if(!u||!ehAdmin(u)||!DEFAULT_GAS_URL)return;gasCall_('apiEnsureRoot',[session.token]).catch(()=>{});},
  excluirDrive(tipo,registroId){if(!session||!registroId)return Promise.reject(new Error('sessão indisponível'));return gasCall_('apiExcluirDrive',[session.token,tipo,registroId]);},
  limparExcluidos(){if(!session)return;return gasCall_('apiLimparExcluidos',[session.token]);},
  escanearPendentes(){return chamarAcaoGet_({acao:'escanearPendentes'});},
  verificarOrfaos(){return chamarAcaoGet_({acao:'verificarOrfaos'});},
  repararDrive(){return gasCall_('apiSincronizarDrive',[session?session.token:'']);},
  async login(email,senha){
    try{
      const saltRes=await gasCall_('apiObterSalt',[email]);
      if(!saltRes||!saltRes.ok) return {ok:false,erro:'E-mail ou senha inválidos.'};
      if(!window.crypto||!crypto.subtle) return {ok:false,erro:'Seu navegador não suporta autenticação segura.'};
      const enc=new TextEncoder();
      let salted='';
      if(saltRes.modo==='salted' && saltRes.salt){
        const digest=await crypto.subtle.digest('SHA-256',enc.encode(String(senha||'')+'::'+String(saltRes.salt)));
        salted=Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
      }
      let unsalted='';
      // Sempre calculamos também o SHA-256 simples para compatibilidade com
      // contas criadas por versões antigas. Ele nunca é a senha em texto.
      if(saltRes.modo==='salted' || saltRes.modo==='unsalted'){
        const digest=await crypto.subtle.digest('SHA-256',enc.encode(String(senha||'')));
        unsalted=Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
      }
      return gasCall_('apiLogin',[email,{salted:salted,unsalted:unsalted}]);
    }catch(e){ return {ok:false,erro:(e&&e.message)||'Não foi possível autenticar.'}; }
  },
  async trocarSenha(userId,senhaAtual,senhaNova){return gasCall_('apiTrocarSenha',[session?session.token:'',senhaAtual,senhaNova]);},
  async atualizarPerfil(userId,nome,email,senha){return gasCall_('apiAtualizarPerfil',[session?session.token:'',nome,email,senha||'']);},
  async pull(){if(!DEFAULT_GAS_URL)throw new Error('URL do Apps Script indisponível');return gasCall_('apiPull',[session?session.token:'']);},
  applyData(data){
    if(!data||typeof data!=='object')return false;
    if(data.ok===false&&data.authOk===false&&session){limparSessao_();mostrarLogin();return false;}
    const temCampos=['Usuarios','Pastas','Documentos','Empresa','Permissoes'].some(f=>Array.isArray(data[f]));
    if(!temCampos)return false;
    adotarDados(data);return true;
  }
};
function adotarDados(data){
  try{
    if(Array.isArray(data.Empresa) && data.Empresa.length){
      empresaMemoria = Object.assign({}, EMPRESA_PADRAO, data.Empresa[0] || {});
      guardarFolhaSeguro('Empresa', data.Empresa);
    }
    if(Array.isArray(data.Permissoes)) guardarFolhaSeguro('Permissoes',data.Permissoes.map(normPermRow));
    if(Array.isArray(data.Usuarios)) guardarFolhaSeguro('Usuarios',data.Usuarios.map(normUserRow));
    ['Pastas','Documentos'].forEach(f=>{if(Array.isArray(data[f])) guardarFolhaSeguro(f,data[f]);});
    if(Array.isArray(data.Excluidos)) guardarFolhaSeguro('Excluidos',data.Excluidos);

/* Busca os dados da planilha para a tela de login (logotipo, empresa, usuários). */
function buscarDadosLogin(){
  const st = $('#loginStatus');
  const setStatus = (html) => {
    if(st){ st.innerHTML = html; st.className = 'login-status erro'; st.classList.remove('hidden'); }
  };
  const limparStatus = () => { if(st){ st.innerHTML = ''; st.classList.add('hidden'); } };

  let tentativa = 0;
  const tentar = () => {
    tentativa++;
    const inicio = Date.now();

    Sync.pull().then(data => {
      if(!data || typeof data !== 'object'){
        throw new Error('Resposta inválida da planilha.');
      }

      const v = Number(data.__v || 0);
      backendAntigo = v < APP_VERSAO;

      // Empresa.logo é a ÚNICA fonte do logotipo. O HTML não contém o
      // logotipo da empresa.
      Sync.applyData(data);
      aplicarMarca();

      if(Number(data.usuarioCount || 0) > 0){
        limparStatus();
      }else{
        setStatus('<i class="fa-solid fa-circle-exclamation"></i> A planilha não retornou usuários na aba "Usuarios".');
      }

      mostrarLogin();
    }).catch(err => {
      aplicarMarca();

      if(tentativa < 3){
        // Tenta novamente porque o Apps Script pode responder com atraso
        // após uma nova implantação.
        setTimeout(tentar, 1200 * tentativa);
        return;
      }

      const msg = String(err && err.message || '');
      let dica = 'Verifique a implantação /exec do Apps Script e se ela está publicada como "Qualquer pessoa".';
      if(msg.indexOf('Tempo esgotado') !== -1){
        dica = 'O Apps Script não respondeu. Publique novamente a implantação /exec da versão 28.';
      }

      setStatus('<i class="fa-solid fa-circle-exclamation"></i> Não foi possível carregar os dados da planilha. ' + dica);
      mostrarLogin();
    });
  };

  tentar();
}

/* ============ helpers de arquivo ============ */
function b64ToBytes(b64){ const bin = atob(b64); const b = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return b; }
function dataURLtoBlobUrl(dataurl){
  const bytes = b64ToBytes(String(dataurl).split(',')[1]);
  const mime = (String(dataurl).match(/data:(.*?);/) || [,'application/octet-stream'])[1];
  return URL.createObjectURL(new Blob([bytes], {type:mime}));
}
function dataURLTexto(dataurl){
  const bin = atob(String(dataurl).split(',')[1]);
  try{ return decodeURIComponent(escape(bin)); }catch(e){ return bin; }
}
function blobToDataURL(blob){
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = rej; r.readAsDataURL(blob); });
}
function obterBuffer(d){
  if(d.arquivo) return Promise.resolve(b64ToBytes(d.arquivo.split(',')[1]).buffer);
  if(d.driveId) return fetch('https://drive.google.com/uc?export=download&id=' + d.driveId)
    .then(r => { if(!r.ok) throw 0; return r.arrayBuffer(); });
  return Promise.reject(new Error('sem arquivo'));
}
function salvarArquivoBin(d, dataUrl, titulo){
  const docs = DB.get('Documentos');
  const tamanho = Math.round(dataUrl.length * 0.75);
  const atualizado = Object.assign({}, d, {titulo: titulo || d.titulo, arquivo: dataUrl, tamanho: tamanho, atualizadoEm: Date.now(), erroUpload: ''});
  DB.set('Documentos', docs.map(x => x.id === d.id ? atualizado : x));
  if(Sync.url()) enviarArquivoAoDrive_(atualizado);
  return true;
}
function fileToJpegDataUrl(file, maxDim, quality){
  maxDim = maxDim || 1600; quality = quality || 0.82;
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const sc = Math.min(1, maxDim / Math.max(w, h));
        w = Math.round(w * sc); h = Math.round(h * sc);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = rej;
      img.src = String(r.result);
    };
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
function paginasParaPDF(pages){
  const jsPDF = window.jspdf.jsPDF;
  const pdf = new jsPDF({unit:'mm', format:'a4'});
  pages.forEach((p, i) => {
    if(i > 0) pdf.addPage();
    const props = pdf.getImageProperties(p);
    const pageW = 210, pageH = 297, margin = 8;
    const ratio = Math.min((pageW - 2*margin) / props.width, (pageH - 2*margin) / props.height);
    const w = props.width * ratio, h = props.height * ratio;
    pdf.addImage(p, 'JPEG', (pageW - w) / 2, (pageH - h) / 2, w, h);
  });
  return pdf.output('datauristring');
}

  if(d.arquivo){
    const url = dataURLtoBlobUrl(d.arquivo);
    const a = document.createElement('a'); a.href = url; a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    return;
  }
  if(d.tipo === 'texto' && d.conteudo != null){
    const url = URL.createObjectURL(new Blob([d.conteudo], {type:'text/plain'}));
    const a = document.createElement('a'); a.href = url; a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();

  if(d.driveId){ window.open('https://drive.google.com/uc?export=download&id=' + d.driveId, '_blank'); return; }

    let texto = '';

   fora da planilha (POST em iframe, sem depender de CORS; o resultado chega — o resultado chega no próximo pull,

function enviarArquivoAoDrive_(doc){
  const u = currentUser();
  Sync.uploadArquivo({
    userId: u ? u.id : '',
    docId: doc.id,
    pastaId: doc.pastaId,
    titulo: doc.titulo,
    ext: doc.ext,
    mime: doc.mime,
    criadoEm: doc.criadoEm,

  });
}
/* ITEM 15: reenvia um documento que ficou com "erroUpload" — usa a mesma
   cópia local do arquivo que já está guardada no navegador (por isso ela
   não é apagada quando o envio falha). Se essa cópia não existir mais
   (ex.: outro navegador, ou já foi limpa), avisa que é preciso excluir e
   subir de novo. */
function reenviarUpload(docId){
  const d = DB.get('Documentos').find(x => x.id === docId);
  if(!d){ return; }
  if(!d.arquivo){
    toast('O conteúdo original não está mais disponível neste navegador. Exclua este item e envie o arquivo de novo.', 'error');
    return;
  }
  DB.set('Documentos', DB.get('Documentos').map(x => x.id === docId ? Object.assign({}, x, {erroUpload:''}) : x));
  enviarArquivoAoDrive_(d);
  toast('Reenviando "' + d.titulo + '" para o Drive…');
  renderItens();
}
function salvarDocArquivo(base, dataUrl){
  const tamanho = Math.round(dataUrl.length * 0.75);
  const docs = DB.get('Documentos');
  const doc = Object.assign({}, base, {arquivo: dataUrl, tamanho});
  docs.push(doc);
  DB.set('Documentos', docs);
  if(Sync.url()) enviarArquivoAoDrive_(doc);
  return true;
}

/* ITEM: mover PASTA para dentro de outra pasta (não só arquivos). Não deixa
   escolher a própria pasta nem nenhuma subpasta dela como destino, senão
   criaria um laço (pasta dentro de si mesma). */
function descendentesDe_(pastaId){
  const proibidas = new Set([pastaId]);
  let mudou = true;
  while(mudou){
    mudou = false;
    DB.get('Pastas').forEach(x => {
      if(x.parentId && proibidas.has(x.parentId) && !proibidas.has(x.id)){ proibidas.add(x.id); mudou = true; }
    });
  }
  return proibidas;
}

async function renderPdfProtegido(bytes, container, protegido){
  if(!window.pdfjsLib) throw new Error('pdf.js indisponível');
  const pdf = await window.pdfjsLib.getDocument({data: bytes}).promise;
  container.innerHTML = protegido
    ? '<div class="restrito-aviso"><i class="fa-solid fa-lock"></i> Visualização protegida — sem barra de download/impressão (' + pdf.numPages + ' página' + (pdf.numPages>1?'s':'') + ')</div>'
    : '';
  for(let i = 1; i <= pdf.numPages; i++){
    const page = await pdf.getPage(i);

  return !o || ehAdmin(o);

function permsEff(userId, pasta){
  const u = getUsuarios().find(x => x.id === userId);
  if(!u || !pasta) return [];
  if(ehAdmin(u)) return ALL_PERMS.slice();
  const global = permsGlobais(u);
  const permRows = getPermissoes();
  let cur = pasta, grant = null, blocked = false;
  while(cur){
    const e = permRows.find(p => p.pastaId === cur.id && p.userId === userId);
    if(e){ grant = e.perms || []; break; }
    // ITEM 2/3: antes, quem CRIOU a pasta ganhava acesso total (ALL_PERMS)
    // dentro dela automaticamente, mesmo sem permissão explícita concedida
    // pelo admin — isso ignorava as permissões globais reais do usuário
    // (ex.: um usuário com permissão só de Visualizar/Enviar/Criar pasta
    // conseguia Baixar/Imprimir/Mover/Editar/Excluir dentro das próprias
    // pastas). Agora ser dono da pasta só interrompe a herança de
    // permissões de pastas superiores — as permissões globais do usuário
    // continuam valendo normalmente, sem elevação automática.
    if(cur.criadaPor === userId) break;
    if(!ownerIsAdmin(cur)){ blocked = true; break; }
    cur = pastaPorId(cur.parentId);
  }
  if(blocked) return [];
  if(grant === 'ALL') return ALL_PERMS.slice();
  if(grant) return grant.filter(k => global.includes(k));
  return global.slice();
}
function permsAtuais(){
  const u = currentUser();
  if(ehAdmin(u)) return ALL_PERMS.slice();
  if(!state.currentFolderId) return permsGlobais(u);
  return permsEff(u.id, pastaPorId(state.currentFolderId));
}
function permsDoc(d){
  const u = currentUser();
  if(ehAdmin(u)) return ALL_PERMS.slice();
  const global = permsGlobais(u);
  // ITEM 2/3: antes, quem ENVIOU o arquivo ganhava acesso total a ele
  // automaticamente (mesma falha da pasta, acima) — removido pelo mesmo
  // motivo. As permissões do documento agora seguem sempre as permissões
  // globais do usuário e/ou as concedidas na pasta onde o arquivo está.
  if(!d.pastaId){
    return global.includes('visualizar') ? global : [];
  }
  return permsEff(u.id, pastaPorId(d.pastaId));
}
function trilha(){
  const chain = []; let cur = pastaPorId(state.currentFolderId);
  while(cur){ chain.unshift(cur); cur = pastaPorId(cur.parentId); }

  DB.set('Permissoes', DB.get('Permissoes').filter(p => p.pastaId !== id));
}

/* ITEM (visualizador de documento): calcula, em pixels, o espaço que sobra
   dentro do modal depois de descontar cabeçalho/metadados/descrição/botões,
   e aplica essa altura na área de pré-visualização — assim só ela rola,
   sem disputa com a barra de rolagem do modal inteiro. */
function ajustarAlturaDocViewer_(){
  const card = document.querySelector('.modal-card.modal-doc-view');
  const corpo = card && card.querySelector('.doc-viewer-corpo');
  if(!card || !corpo) return;
  const calc = () => {
    const estilo = getComputedStyle(card);
    const padV = parseFloat(estilo.paddingTop) + parseFloat(estilo.paddingBottom);
    const outros = Array.from(card.children).reduce((soma, el) => el === corpo ? soma : soma + el.offsetHeight, 0);
    // ITEM: antes usava card.scrollHeight como teto — só que, na primeira
    // medição, o próprio .doc-viewer-corpo ainda estava no tamanho mínimo
    // (240px), então scrollHeight vinha pequeno e o cálculo ficava "preso"
    // nesse valor pequeno pra sempre (nunca crescia de fato com a tela).
    // Agora o teto é só a altura máxima real do modal (92% da viewport).
    const tetoCard = window.innerHeight * 0.92;
    const disponivel = tetoCard - padV - outros - 14;
    corpo.style.height = Math.max(320, disponivel) + 'px';
  };
  calc();
  if(state._ajustarViewerResize) window.removeEventListener('resize', state._ajustarViewerResize);
  state._ajustarViewerResize = calc;
  window.addEventListener('resize', calc);
}

function itemMenuLinha_(o){
  if(o.disabled) return '<div class="menu-line locked"><i class="fa-solid ' + o.ic + '"></i>' + esc(o.title) + '</div>';
  return '<button class="menu-line' + (o.danger ? ' danger' : '') + '" data-action="' + o.action + '" data-id="' + esc(o.id) + '" data-fecha-menu="1"><i class="fa-solid ' + o.ic + '"></i>' + esc(o.title) + '</button>';
}
function renderAcoes_(itens, tipo, id){
  itens = itens.filter(Boolean);
  if(!itens.length) return '';
  if(ehMobile()){
    const menuId = 'menuItem-' + tipo + '-' + id;
    return '<div class="item-menu"><button class="btn-ic" data-action="toggle-item-menu" data-target="' + menuId + '" title="Mais ações"><i class="fa-solid fa-ellipsis-vertical"></i></button>' +
      '<div class="item-menu-pop" id="' + menuId + '">' + itens.map(itemMenuLinha_).join('') + '</div></div>';
  }
  return itens.map(itemBotao_).join('');
}
function itensPasta_(p, dono, perms){
  return [
    dono ? {ic:'fa-share-nodes', title:'Permissões da pasta', action:'compartilhar', id:p.id} : null,
    // ITEM: mover pasta usa a mesma permissão de "excluir_pasta" (gestão de
    // pastas) — admin sempre tem via permsAtuais/permsEff.
    perms.includes('excluir_pasta') ? {ic:'fa-folder-tree', title:'Mover', action:'mover-pasta', id:p.id} : null,
    perms.includes('excluir_pasta') ? {ic:'fa-trash-can', title:'Excluir pasta', action:'excluir-pasta', id:p.id, danger:true} : null
  ];
}
function itensDoc_(d, pd){
  return [
    pd.includes('visualizar') ? {ic:'fa-eye', title:'Visualizar', action:'ver-doc', id:d.id} : null,
    acaoBaixarDescr_(d, pd.includes('download')),
    d.erroUpload ? {ic:'fa-rotate-right', title:'Reenviar para o Drive (' + d.erroUpload + ')', action:'reenviar-doc', id:d.id} : null,
    pd.includes('editar') ? {ic:'fa-folder-tree', title:'Mover', action:'mover-doc', id:d.id} : null,
    pd.includes('editar') ? {ic:'fa-pen', title:'Editar', action:'editar-doc', id:d.id} : null,
    pd.includes('excluir') ? {ic:'fa-trash-can', title:'Excluir', action:'excluir-doc', id:d.id, danger:true} : null
  ];
}
function itensVisiveis(){
  const u = currentUser();
  const q = state.search.trim().toLowerCase();
  let folders = DB.get('Pastas').filter(p => (p.parentId || null) === (state.currentFolderId || null));
  let docs    = DB.get('Documentos').filter(d => (d.pastaId  || null) === (state.currentFolderId || null));
  if(!state.currentFolderId && !ehAdmin(u)){
    folders = folders.filter(p => permsEff(u.id, p).includes('visualizar'));
    docs = docs.filter(d => permsDoc(d).includes('visualizar'));
  } else if(state.currentFolderId){
    folders = folders.filter(p => p.criadaPor === u.id || ehAdmin(u) || permsEff(u.id, p).includes('visualizar'));
    // ITEM 2/3: faltava esse mesmo filtro aqui — dentro de uma pasta, os
    // ARQUIVOS apareciam pra todo mundo que tivesse acesso à pasta, mesmo
    // sem permissão de Visualizar concedida a esse usuário especificamente.
    if(!ehAdmin(u)) docs = docs.filter(d => permsDoc(d).includes('visualizar'));
  }
  docs = docs.filter(d => formatoVisivel(d, u));
  if(q){
    folders = folders.filter(p => p.nome.toLowerCase().includes(q));
    docs    = docs.filter(d => d.titulo.toLowerCase().includes(q));
  }
  return {folders, docs};
}

  const el = $('#itens'); if(!el) return;
  try{

    const {folders, docs} = itensVisiveis();
    const perms = permsAtuais();
    const usuarios = getUsuarios();
    const nomeDe = id => (usuarios.find(x => x.id === id) || {}).nome || '—';
    const mode = state.viewMode || 'detalhes';
    const grid = ['xg','g','m','p'].includes(mode);

    const acoesPasta = (p, dono) => renderAcoes_(itensPasta_(p, dono, perms), 'pasta', p.id);
    const acoesDoc = (d, pd) => renderAcoes_(itensDoc_(d, pd), 'doc', d.id);
    const chk = (tipo, itemId) => !state.selecaoAtiva ? '' :
      '<input type="checkbox" class="sel-chk" data-action="toggle-sel" data-tipo="' + tipo + '" data-id="' + itemId + '" ' + (state.selecao.has(selKey(tipo, itemId)) ? 'checked' : '') + '>';
    const selCls = (tipo, itemId) => state.selecaoAtiva && state.selecao.has(selKey(tipo, itemId)) ? ' sel-row' : '';

    let html = '';
    if(grid){
      el.className = 'itens-grid mode-' + mode;
      html = folders.map(p => {

        const privada = !ownerIsAdmin(p) && p.criadaPor !== u.id;
        return '<div class="gcard' + selCls('pasta', p.id) + '" data-action="open-folder" data-id="' + p.id + '">' +
          chk('pasta', p.id) +
          '<span class="item-ic ic-pasta"><i class="fa-solid ' + (privada ? 'fa-user-lock' : 'fa-folder') + '"></i></span>' +
          '<span class="gname" title="' + esc(p.nome) + '">' + esc(p.nome) + '</span>' +

      }).join('') +

        const ci = catInfo(d); const pd = permsDoc(d);

      }).join('');
    } else if(mode === 'lista'){
      el.className = 'itens';
      html = folders.map(p => {
        const dono = p.criadaPor === u.id || ehAdmin(u);
        const privada = !ownerIsAdmin(p) && p.criadaPor !== u.id;
        return '<div class="lrow' + selCls('pasta', p.id) + '" data-action="open-folder" data-id="' + p.id + '">' +
          chk('pasta', p.id) +
          '<span class="item-ic ic-pasta"><i class="fa-solid ' + (privada ? 'fa-user-lock' : 'fa-folder') + '"></i></span>' +
          '<span class="gname">' + esc(p.nome) + '</span>' +
          '<div class="item-actions">' + acoesPasta(p, dono) + '<i class="fa-solid fa-chevron-right chev"></i></div></div>';
      }).join('') +
      docs.map(d => {
        const ci = catInfo(d); const pd = permsDoc(d);
        return '<div class="lrow' + selCls('doc', d.id) + '">' +
          chk('doc', d.id) +
          '<span class="item-ic ' + ci.cls + '"><i class="fa-solid ' + ci.ic + '"></i></span>' +
          '<span class="gname">' + esc(d.titulo) + '</span>' +
          '<div class="item-actions">' + acoesDoc(d, pd) + '</div></div>';
      }).join('');
    } else {
      el.className = 'itens';
      html = folders.map(p => {
        const dono = p.criadaPor === u.id || ehAdmin(u);
        const privada = !ownerIsAdmin(p) && p.criadaPor !== u.id;
        return '<div class="item-row' + selCls('pasta', p.id) + '" data-action="open-folder" data-id="' + p.id + '">' +
          chk('pasta', p.id) +
          '<span class="item-ic ic-pasta"><i class="fa-solid ' + (privada ? 'fa-user-lock' : 'fa-folder') + '"></i></span>' +
          '<div class="item-info"><strong>' + esc(p.nome) + '</strong><small>Pasta' + (privada ? ' privada' : '') + ' • ' + esc(nomeDe(p.criadaPor)) + ' • ' + fmtData(p.criadaEm) + '</small></div>' +

        const statusDrive = d.erroUpload ? ' • <i class="fa-solid fa-triangle-exclamation" style="color:#c0392b" title="' + esc(d.erroUpload) + '"></i> Falha no envio'
          : d.driveId ? ' • <i class="fa-brands fa-google-drive"></i> Drive'
          : (d.tipo === 'arquivo' && Sync.url()) ? ' • <i class="fa-solid fa-spinner fa-spin"></i> Enviando para o Drive…' : '';
        return '<div class="item-row' + selCls('doc', d.id) + '">' +
          chk('doc', d.id) +

          '<div class="item-info"><strong>' + esc(d.titulo) + '</strong>' + (d.descricao ? '<span class="item-desc">' + esc(d.descricao) + '</span>' : '') + '<small>' + ci.rot + (d.ext ? ' .'+esc(d.ext) : '') + tam + ' • ' + esc(nomeDe(d.criadoPor)) + ' • ' + fmtData(d.atualizadoEm || d.criadoEm) + statusDrive + '</small></div>' +
          '<span class="tag tag-arq"><i class="fa-solid ' + ci.ic + '"></i> ' + ci.rot + '</span>' +
          '<div class="item-actions">' + acoesDoc(d, pd) + '</div></div>';
      }).join('');
    }
    if(!html) html = '<div class="vazio"><i class="fa-solid fa-folder-open"></i><p>Sem arquivos nesta pasta.</p></div>';
    el.innerHTML = html;
  }catch(err){
    el.innerHTML = '<div class="vazio"><i class="fa-solid fa-triangle-exclamation"></i><p>Erro ao carregar os arquivos: ' + esc(err && err.message ? err.message : err) + '</p></div>';
  }
}

/* ================= UPLOAD ================= */
function handleUpload(file){
  if(!file) return;
  const u = currentUser();
  if(!permsAtuais().includes('upload')){ toast('Sem permissão de upload nesta pasta.','error'); return; }
  const ext = (file.name.includes('.') ? file.name.split('.').pop() : 'bin').toLowerCase();
  const permitidos = formatosPermitidos();
  if(!permitidos.includes(ext)){
    toast('Formato .' + ext + ' não permitido. Formatos liberados: ' + permitidos.join(', ') + '.','error');
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    const dataUrl = String(reader.result);
    const idDoc = uid('d');
    const base = {id:idDoc, pastaId: state.currentFolderId, titulo: file.name.replace(/\.[^.]+$/,''), tipo:'arquivo', ext:ext, mime:file.type||'', criadoPor:u.id, criadoEm:Date.now(), atualizadoEm:Date.now()};
    if(salvarDocArquivo(base, dataUrl)){ toast('Arquivo enviado: ' + file.name); renderItens(); }
  };
  reader.readAsDataURL(file);
}

function noPrev(ci){ return '<div class="no-prev"><i class="fa-solid ' + ci.ic + '"></i>Pré-visualização indisponível para este formato.<br>Use "Baixar" para abrir no aplicativo correspondente.</div>'; }
function modalVer(docId){
  const d = DB.get('Documentos').find(x => x.id === docId); if(!d) return;
  const cat = categoria(d), ci = catInfo(d);
  const autor = (getUsuarios().find(x => x.id === d.criadoPor) || {}).nome || '—';
  const pasta = pastaPorId(d.pastaId);
  const pd = permsDoc(d);
  // ITEM 2/3: sem permissão de Visualizar para este documento específico,
  // nem abre o visualizador — antes o botão "Visualizar/ler" não checava
  // permissão nenhuma e qualquer usuário conseguia abrir qualquer arquivo.
  if(!pd.includes('visualizar')){ toast('Você não tem permissão para visualizar este arquivo.','error'); return; }
  const podeBaixar = pd.includes('download');
  const podeImprimir = pd.includes('imprimir');
  const protegido = !(podeBaixar && podeImprimir);
  const drivePrev = d.driveId ? 'https://drive.google.com/file/d/' + d.driveId + '/preview' : null;
  let corpo = '';
  pdfPendente = null; officePendente = null;
  const placeholderOffice = '<div class="doc-body" id="officePrev"><div class="no-prev" style="background:transparent;padding:30px"><i class="fa-solid fa-spinner fa-spin"></i>Carregando pré-visualização…</div></div>';

  if(d.tipo === 'texto'){
    corpo = '<div class="doc-body">' + esc(d.conteudo) + '</div>';
  } else if(d.arquivo || d.driveId){
    if(cat === 'pdf'){
      // ITEM: antes, quem tinha permissão total (baixar+imprimir) sempre via
      // o PDF através do player embutido do Google Drive (iframe de outro
      // site — a rolagem dali é controlada pelo Drive, não por nós, e não dá
      // pra "inserir" uma barra nossa dentro da página de outro domínio).
      // Agora tentamos SEMPRE o nosso próprio visualizador primeiro (páginas
      // renderizadas em canvas, dentro de uma div com rolagem 100% nossa) —
      // só caímos para o iframe do Drive se não for possível ler os bytes do
      // arquivo (o único caso realista: arquivo sem cópia local e a busca ao
      // Drive falhar por CORS).
      const aviso = protegido
        ? '<div class="restrito-aviso"><i class="fa-solid fa-lock"></i> Carregando visualização protegida…</div>'
        : '<div class="no-prev" style="background:transparent;padding:30px"><i class="fa-solid fa-spinner fa-spin"></i>Carregando pré-visualização…</div>';
      corpo = '<div class="pdf-restrito" id="pdfRestrito">' + aviso + '</div>';
      pdfPendente = {doc: d, protegido, fallbackIframe: drivePrev};
    }
    else if(cat === 'img'){
      corpo = '<div class="' + (protegido ? 'pdf-restrito' : '') + '"><img class="prev-img" src="' + (d.arquivo ? d.arquivo : 'https://lh3.googleusercontent.com/d/' + d.driveId) + '" alt=""></div>';
    }
    else if(cat === 'video'){
      corpo = d.arquivo ? '<div class="' + (protegido ? 'pdf-restrito' : '') + '"><video class="prev-media" controls src="' + d.arquivo + '"></video></div>' : '<iframe class="pdf-frame" scrolling="yes" src="' + drivePrev + '"></iframe>';
    }
    else if(cat === 'audio' && d.arquivo){
      corpo = '<div style="padding:24px 0"><audio controls style="width:100%" src="' + d.arquivo + '"></audio></div>';
    }
    else if(cat === 'txt' && d.arquivo){
      corpo = '<div class="doc-body">' + esc(dataURLTexto(d.arquivo)) + '</div>';
    }
    else if(cat === 'word' || cat === 'sheet'){
      corpo = placeholderOffice;
      officePendente = {kind: cat, doc: d};
    }
    else corpo = noPrev(ci);
  } else corpo = noPrev(ci);

  bloqueioAtivo = protegido;

  const acoes =
    (podeBaixar
      ? '<button class="btn btn-light" data-action="baixar-doc" data-id="' + d.id + '"><i class="fa-solid fa-download"></i> Baixar</button>'
      : '<button class="btn btn-light" disabled title="Download não permitido"><i class="fa-solid fa-lock"></i> Baixar</button>') +
    (podeImprimir ? '<button class="btn btn-light" data-action="imprimir-doc" data-id="' + d.id + '"><i class="fa-solid fa-print"></i> Imprimir</button>' : '') +
    '<button class="btn btn-primary" data-action="fechar-modal">Fechar</button>';
  openModal('<div class="doc-head"><h3><i class="fa-solid ' + ci.ic + '"></i> ' + esc(d.titulo) + '</h3>' +
    '<button class="btn-ic" data-action="fechar-modal" title="Fechar"><i class="fa-solid fa-xmark"></i></button></div>' +
    '<div class="doc-meta"><span><i class="fa-solid fa-user"></i>' + esc(autor) + '</span>' +
    '<span><i class="fa-solid fa-folder"></i>' + (pasta ? esc(pasta.nome) : 'Raiz') + '</span>' +
    '<span><i class="fa-solid fa-clock"></i>' + fmtData(d.atualizadoEm || d.criadoEm) + '</span>' +
    (d.tamanho ? '<span><i class="fa-solid fa-database"></i>' + fmtTam(d.tamanho) + '</span>' : '') + '</div>' +
    (d.descricao ? '<p class="modal-sub" style="margin-top:-8px"><i class="fa-solid fa-align-left"></i> ' + esc(d.descricao) + '</p>' : '') +
    '<div class="doc-viewer-corpo">' + corpo + '</div>' +
    '<div class="modal-actions">' + acoes + '</div>', 'modal-doc-view');
  ajustarAlturaDocViewer_();

  const cont0 = $('#officePrev');
  if(officePendente && cont0){
    const alvo = officePendente;
    const falha = () => { cont0.innerHTML = '<div class="no-prev" style="background:transparent"><i class="fa-solid ' + ci.ic + '"></i>Não foi possível gerar a pré-visualização.<br>Use "Baixar" para abrir no aplicativo correspondente.</div>'; };
    obterBuffer(alvo.doc)
      .then(buf => alvo.kind === 'word' ? renderDocx(buf, cont0) : renderXlsx(buf, cont0))
      .catch(falha);
  }
  if(pdfPendente){
    const alvo = pdfPendente;
    const cont = $('#pdfRestrito');
    const falhaSemAlternativa = () => { if(cont) cont.innerHTML = '<div class="no-prev" style="width:100%"><i class="fa-solid fa-lock"></i>Visualização protegida indisponível para este arquivo.<br>Solicite permissão de download para acessar o conteúdo.</div>'; };
    // ITEM: quando o nosso visualizador (canvas) não consegue ler os bytes
    // do arquivo (ex.: sem cópia local e a busca ao Drive falhou por CORS),
    // caímos de volta para o player embutido do próprio Drive — que sempre
    // funciona, por ser a página pública do próprio Drive, mas cuja barra de
    // rolagem é deles, não nossa.
    const falhaComFallback = () => {
      if(alvo.fallbackIframe && cont && cont.parentElement){
        cont.parentElement.innerHTML = '<iframe class="pdf-frame" scrolling="yes" referrerpolicy="no-referrer" src="' + esc(alvo.fallbackIframe) + '"></iframe>';
      } else {
        falhaSemAlternativa();
      }
    };
    obterBuffer(alvo.doc)
      .then(buf => renderPdfProtegido(new Uint8Array(buf), cont, alvo.protegido))
      .catch(alvo.protegido ? falhaSemAlternativa : falhaComFallback);
  }
}

function modalCompartilhar(pastaId){
  const p = pastaPorId(pastaId); if(!p) return;
  const usuarios = getUsuarios().filter(x => x.papel !== 'master');
  const perms = getPermissoes();
  const rows = usuarios.map(x => {
    const cur = (perms.find(pp => pp.pastaId === pastaId && pp.userId === x.id) || {}).perms || [];
    return '<div class="prow" data-user="' + x.id + '" data-nome="' + esc((x.nome + ' ' + x.email).toLowerCase()) + '">' +
      '<div class="prow-left"><span class="avatar">' + iniciais(x.nome) + '</span>' +
        '<div class="perm-user"><strong>' + esc(x.nome) + '</strong>' +
        '<small>' + esc(x.email) + ' • ' + PAPEIS[x.papel] + ' <span class="pcount tag ' + (cur.length ? 'tag-edit' : 'tag-view') + '">' + (cur.length ? cur.length + ' permissões' : 'Sem acesso') + '</span></small></div></div>' +
      '<div class="ptogs">' + PERMS_LIST.map(pm =>
        '<button type="button" class="ptog' + (cur.includes(pm.k) ? ' on' : '') + '" data-action="toggle-perm" data-perm="' + pm.k + '" title="' + pm.label + '"><i class="fa-solid ' + pm.ic + '"></i></button>'
